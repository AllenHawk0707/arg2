<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大同中学墙墙</title>
    <style>
        /* ══ Windows 10 Fluent ══ */
        :root {
            --accent: #0078d7;
            --accent-d: #0063b1;
            --accent-l: #cce4f7;
            --bg: #f2f2f2;
            --surface: #ffffff;
            --surface-2: #fafafa;
            --border: #d2d2d2;
            --border-2: #e5e5e5;
            --ink: #1f1f1f;
            --ink-2: #555555;
            --ink-3: #8a8a8a;
            --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--bg);
            margin: 0 auto;
            padding: 24px 16px 48px;
            max-width: 920px;
            min-height: 100vh;
        }

        /* ── 标题栏 ── */
        .xp-window {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 32px;
            padding: 0 0 0 12px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--ink);
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            font-weight: 400;
        }

        .window-buttons {
            display: flex;
            align-self: stretch;
        }

        .window-btn {
            width: 45px;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            font-size: 10px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .window-btn:hover { background-color: #e5e5e5; }
        .window-btn:last-child:hover { background-color: #e81123; color: #fff; }

        /* ── 主面板 ── */
        .main-content {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            min-height: 600px;
            padding: 0 0 1px;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            align-items: stretch;
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border-2);
            padding: 0 8px;
        }

        .toolbar-btn {
            padding: 11px 16px;
            font-family: var(--sans);
            font-size: 13px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
        }

        .toolbar-btn:hover {
            color: var(--ink);
            background-color: #f0f0f0;
        }

        .toolbar-btn.active {
            color: var(--accent);
            font-weight: 600;
            border-bottom-color: var(--accent);
        }

        .content-area {
            background-color: var(--surface);
            border: none;
            padding: 14px 16px;
            min-height: 460px;
        }

        .wall-meta {
            font-size: 12px;
            color: var(--ink-3);
            padding-bottom: 10px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border-2);
        }

        /* ── 帖子卡片 ── */
        .wall-post {
            background-color: var(--surface);
            border: 1px solid var(--border-2);
            margin: 10px 0;
            box-shadow: none;
        }
        .wall-post:hover { border-color: var(--border); }

        .post-info-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border-2);
        }

        .post-avatar {
            width: 26px;
            height: 26px;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            color: #fff;
            background-color: var(--accent);
            border: none;
            border-radius: 50%;
            overflow: hidden;
        }

        /* 默认小人头像（无自定义头像时） */
        .post-avatar.is-default {
            background-color: #b8b8b8;
        }
        .post-avatar svg {
            width: 70%;
            height: 70%;
            display: block;
            fill: #fff;
        }

        .post-name {
            font-weight: 600;
            color: var(--accent);
        }

        .post-tag {
            padding: 1px 8px;
            font-size: 11px;
            color: var(--ink-2);
            background-color: #f0f0f0;
            border: 1px solid var(--border-2);
        }

        .post-tag.hot { color: #b0344f; background-color: #fdeef1; border-color: #f4ccd6; }
        .post-tag.tree { color: #2c7a52; background-color: #eaf7f0; border-color: #bfe3d0; }

        .post-title-bar {
            padding: 11px 12px 3px;
            font-size: 15px;
            font-weight: 600;
            background-color: transparent;
            border: none;
        }

        .post-content-body {
            padding: 0 12px 11px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-2);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--ink-3);
            border-top: 1px solid var(--border-2);
        }

        .post-actions span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            cursor: pointer;
            user-select: none;
        }
        .post-actions span:hover { color: var(--accent); background-color: var(--accent-l); }
        .post-actions .liked { color: #b0344f; font-weight: 600; }

        .reply-box {
            margin: 0;
            padding: 10px 12px 12px;
            border-top: 1px solid var(--border-2);
            background-color: var(--surface-2);
            display: none;
        }
        .reply-box.open { display: block; }

        .reply-item {
            font-size: 12.5px;
            color: var(--ink-2);
            padding: 4px 0;
            border-bottom: 1px solid var(--border-2);
        }
        .reply-item:last-of-type { border-bottom: none; }
        .reply-item b { color: var(--accent); }

        .reply-input {
            width: calc(100% - 76px);
            padding: 6px 10px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: var(--ink);
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0;
            outline: none;
        }
        .reply-input::placeholder { color: var(--ink-3); }
        .reply-input:focus { border-color: var(--accent); border-width: 2px; padding: 5px 9px; }

        .reply-send {
            margin-left: 6px;
            padding: 6px 18px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: #fff;
            background-color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 0;
            cursor: pointer;
        }
        .reply-send:hover { background-color: var(--accent-d); border-color: var(--accent-d); }

        /* 涂黑文字 */
        .redacted-password {
            background-color: var(--ink);
            color: transparent;
            display: inline-block;
            padding: 0 6px;
            font-weight: bold;
            cursor: default;
            user-select: none;
            height: 1em;
            vertical-align: middle;
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 0;
            padding: 7px 16px;
            font-size: 11.5px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border-top: 1px solid var(--border-2);
        }

        /* ── 电源开关 ── */
        #power-btn {
            position: fixed; bottom: 16px; right: 16px; z-index: 10001;
            padding: 6px 18px;
            font-family: var(--sans); font-size: 12.5px;
            color: var(--ink);
            background-color: #e1e1e1;
            border: 1px solid var(--border);
            border-radius: 0;
            cursor: pointer; user-select: none;
        }
        #power-btn:hover { background-color: #d6d6d6; }
        #power-btn:active { background-color: #cccccc; }

        #power-off {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: none; align-items: center; justify-content: center;
            color: #4a4a4a; font-size: 13px; letter-spacing: 4px;
            font-family: var(--sans);
        }
        #power-off.on { display: flex; }

        /* ── 响应式 ── */
        @media (max-width: 640px) {
            body { padding: 12px 8px 44px; }
            .xp-window { padding-left: 10px; }
            .window-btn { width: 38px; }
            .toolbar { padding: 0 4px; }
            .toolbar-btn { padding: 10px 12px; font-size: 12.5px; }
            .content-area { padding: 12px; }
            .reply-input { width: 100%; }
            .reply-send { width: 100%; margin: 8px 0 0; }
            #power-btn { bottom: 12px; right: 12px; }
        }
    </style>
</head>
<body>

<div id="power-btn" onclick="togglePower()">关闭</div>
<div id="power-off">●  显示器已关闭 — 点击任意处开机</div>

<div class="xp-window">
    <div class="window-title">
        <span class="mode-label">大同中学墙墙 v1.0</span>
    </div>
    <div class="window-buttons">
        <div class="window-btn">_</div>
        <div class="window-btn">□</div>
        <div class="window-btn" onclick="togglePower()" style="cursor:pointer;">×</div>
    </div>
</div>

<div class="main-content">

<div class="toolbar">
    <button class="toolbar-btn active" onclick="filterWall('all', this)">墙墙</button>
   
</div>

<div class="content-area" id="wall">
    <div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · 共 <span id="post-count">0</span> 条留言</div>
    <!-- 帖子由 JS 渲染 -->
</div>

<div class="statusbar">
    <span id="status-text">就绪</span>
    <span>大同中学墙墙 · 最后更新：<span id="now-date"></span></span>
</div>

</div>

<script>
/* ── 初始示例留言（呼应 logs 世界观，但偏日常闲聊）── */
var SEED_POSTS = [
    { name:'高二（3）小苏', tag:'chat', avatar:'', title:'课间操过了十分钟才响铃 结果还要整队出操 何意味',
            content:'课间操过了十分钟才响铃 结果还要整队出操 何意味',
            likes:12, replies:[] },
    { name:'高二（4） Kevin', tag:'tree', avatar:'🌫', title:'篮球来单挑',
      content:'打爆全世界',
      likes:34, replies:[{n:'GYF',t:'老弟你叫啥呢'}] },
    { name:' YZX', tag:'chat', avatar:'', title:'好想念原十一班的同学们',
      content:'怎么就分班了啊，我们十一班怎么就没了。\n 我就和WJY和孙孙在一个班 好无聊',
      likes:8, replies:[{n:'子轩子轩',t:'你们在几班啊 我在9班'}] },
    { name:'昂子胡', tag:'chat', avatar:'', title:'吐槽一下学校的离谱校规',
      content:'莫名奇妙的分班 把我和好朋友都拆散了\n什么时候大家一起聚一下？',
      likes:56, replies:[{n:'1140',t:'我们小理科管的好严啊 感觉没时间'}] },
    { name:'Bowen SUN', tag:'chat', avatar:'？？', title:'我们班好多凯文',
      content:'和郑凯文分到一个班了\n结果这个班还有个赵和罗\n蚌埠不住',
      likes:89, replies:[{n:'思远思齐',t:'什么鬼，原来我们班有这么多凯文 我还以为之前听错了'},{n:'LYH',t:'啊 你们在四班吗'}] },
    { name:'小朱', tag:'chat', avatar:'🕯', title:'好讨厌小团体',
      content:'家人们谁懂啊 和小团体分到一个班了\nZSH，CXY和LYT这三个人\n到底在干些什么，天天聚在一起吵',
      likes:21, replies:[{n:'WJY',t:'听说HJJ和ZWB也在你们班啊 他们怎么样了'},{n:'Wenbo Zhou',t:'不 我们两个在二班 \n和林SQ，李MJ在一个班'}] },
    { name:'1145', tag:'chat', avatar:'👧', title:'我们班好像有人阳了',
      content:'怎么到现在还有人生病啊喂',
      likes:17, replies:[{n:'梦见瑶瑶',t:'好吓人'}] },
    { name:' YaJing', tag:'chat', avatar:'', title:'我的东西',
      content:'完蛋了 我还有好多东西落在教室柜子里\n不会被收了吧',
      likes:2, replies:[{n:'zrt',t:'听说现在被当成走班教室了 \n 不知道你的东西还在不在'}] },
    { name:' 晨间曦光', tag:'chat', avatar:'', title:'怎么没人',
      content:'人好少啊 是不是墙刚开 看看明天会不会更新',
      likes:1, replies:[] },
    { name:' XYW', tag:'chat', avatar:'', title:'上学好累啊',
      content:'什么时候能放学？',
      likes:1, replies:[{n:'语嫣红',t:'明天还要调休····'}] }
];

var TAG_LABEL = { chat:'日常闲聊', love:'表白墙', tree:'树洞', lost:'失物招领' };
var STORE_KEY = 'xyzh_wall_posts_v2';

function loadPosts(){
    try {
        var raw = localStorage.getItem(STORE_KEY);
        if(raw) return JSON.parse(raw);
    } catch(e){}
    return null;
}
function savePosts(posts){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(posts)); } catch(e){}
}

var posts = loadPosts() || SEED_POSTS.map(function(p){ p.id = 'seed_'+Math.random().toString(36).slice(2); return p; });

function nowStr(){
    var d = new Date();
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

var currentFilter = 'all';

function renderWall(){
    var wall = document.getElementById('wall');
    var meta = '<div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · 共 <span id="post-count">'+posts.length+'</span> 条留言</div>';
    var html = meta;
    var shown = 0;
    for(var i=0;i<posts.length;i++){
        var p = posts[i];
        if(currentFilter!=='all' && p.tag!==currentFilter) continue;
        shown++;
        var tagCls = p.tag==='love' ? 'post-tag hot' : (p.tag==='tree' ? 'post-tag tree' : 'post-tag');
        var repliesHtml = '';
        if(p.replies && p.replies.length){
            for(var r=0;r<p.replies.length;r++){
                repliesHtml += '<div class="reply-item"><b>'+escapeHtml(p.replies[r].n)+'：</b>'+escapeHtml(p.replies[r].t)+'</div>';
            }
        }
        html +=
        '<div class="wall-post" data-id="'+p.id+'">'+
            '<div class="post-info-bar">'+
                avatarHtml(p.avatar)+
                '<span class="post-name">'+escapeHtml(p.name)+'</span>'+
                '<span class="'+tagCls+'">'+TAG_LABEL[p.tag]+'</span>'+
                '<span style="margin-left:auto;">🕒 '+nowStr()+'</span>'+
            '</div>'+
            '<div class="post-title-bar">'+escapeHtml(p.title)+'</div>'+
            '<div class="post-content-body">'+escapeHtml(p.content)+'</div>'+
            '<div class="post-actions">'+
                '<span class="like-btn" onclick="likePost(\''+p.id+'\', this)">👍 赞 <b>'+p.likes+'</b></span>'+
                '<span onclick="toggleReply(\''+p.id+'\')">💬 回复 ('+(p.replies?p.replies.length:0)+')</span>'+
            '</div>'+
            '<div class="reply-box" id="rb_'+p.id+'">'+ repliesHtml +
                '<div style="margin-top:6px;"><input class="reply-input" id="ri_'+p.id+'" placeholder="回一句……" maxlength="80">'+
                '<button class="reply-send" onclick="addReply(\''+p.id+'\')">发送</button></div>'+
            '</div>'+
        '</div>';
    }
    if(shown===0){
        html += '<div style="text-align:center;color:#999;padding:40px 0;">这个分类暂时还没有留言，快来抢沙发～</div>';
    }
    wall.innerHTML = html;
    var pc = document.getElementById('post-count');
    if(pc) pc.textContent = posts.length;
}

function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
}

/* 头像：统一使用默认小人图标 */
var DEFAULT_AVATAR_SVG =
    '<svg viewBox="0 0 24 24" aria-hidden="true">'+
    '<circle cx="12" cy="8" r="4"/>'+
    '<path d="M12 14c-4.4 0-8 2.7-8 6v1h16v-1c0-3.3-3.6-6-8-6z"/>'+
    '</svg>';

function avatarHtml(){
    return '<span class="post-avatar is-default">'+DEFAULT_AVATAR_SVG+'</span>';
}

function likePost(id, el){
    for(var i=0;i<posts.length;i++){
        if(posts[i].id===id){
            if(el.dataset.liked==='1'){ posts[i].likes--; el.dataset.liked='0'; el.classList.remove('liked'); }
            else { posts[i].likes++; el.dataset.liked='1'; el.classList.add('liked'); }
            el.innerHTML='👍 赞 <b>'+posts[i].likes+'</b>';
            savePosts(posts);
            return;
        }
    }
}

function toggleReply(id){
    var box = document.getElementById('rb_'+id);
    if(box) box.classList.toggle('open');
}

function addReply(id){
    var inp = document.getElementById('ri_'+id);
    var t = inp.value.trim();
    if(!t) return;
    for(var i=0;i<posts.length;i++){
        if(posts[i].id===id){
            if(!posts[i].replies) posts[i].replies=[];
            posts[i].replies.push({n:'我', t:t});
            savePosts(posts);
            break;
        }
    }
    renderWall();
}

function filterWall(type, btn){
    currentFilter = type;
    document.querySelectorAll('.toolbar-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    renderWall();
}

function setStatus(t){ var s=document.getElementById('status-text'); if(s) s.textContent=t; }

function togglePower(){
    var po = document.getElementById('power-off');
    po.classList.add('on');
}
document.getElementById('power-off').addEventListener('click', function(){
    this.classList.remove('on');
});

document.getElementById('now-date').textContent = nowStr().slice(0,10);

renderWall();

/* ── 涂黑文字块：用宽度遮住原文字 ── */
document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.redacted-password').forEach(function(el){
        var len = el.textContent.length;
        el.textContent='';
        var w = Math.max(len*10,14);
        el.style.width=w+'px'; el.style.minWidth=w+'px';
    });
});
</script>

</body>
</html>
