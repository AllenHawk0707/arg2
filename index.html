<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大同中学墙墙</title>
    <style>
        /* ══ Windows 10 Fluent ══ */
        :root {
            --accent: #0078d7;
            --accent-d: #0063b1;
            --accent-l: #cce4f7;
            --bg: #f2f2f2;
            --surface: #ffffff;
            --surface-2: #fafafa;
            --border: #d2d2d2;
            --border-2: #e5e5e5;
            --ink: #1f1f1f;
            --ink-2: #555555;
            --ink-3: #8a8a8a;
            --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--bg);
            margin: 0 auto;
            padding: 24px 16px 48px;
            max-width: 920px;
            min-height: 100vh;
        }

        /* ── 标题栏 ── */
        .xp-window {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 32px;
            padding: 0 0 0 12px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--ink);
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            font-weight: 400;
        }

        .window-buttons {
            display: flex;
            align-self: stretch;
        }

        .window-btn {
            width: 45px;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            font-size: 10px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .window-btn:hover { background-color: #e5e5e5; }
        .window-btn:last-child:hover { background-color: #e81123; color: #fff; }

        /* ── 主面板 ── */
        .main-content {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            min-height: 600px;
            padding: 0 0 1px;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            align-items: stretch;
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border-2);
            padding: 0 8px;
        }

        .toolbar-btn {
            padding: 11px 16px;
            font-family: var(--sans);
            font-size: 13px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
        }

        .toolbar-btn:hover {
            color: var(--ink);
            background-color: #f0f0f0;
        }

        .toolbar-btn.active {
            color: var(--accent);
            font-weight: 600;
            border-bottom-color: var(--accent);
        }

        /* 班级筛选栏 */
        .class-bar {
            padding: 0 8px 0 4px;
            background-color: var(--surface);
        }
        .class-bar-label {
            display: flex;
            align-items: center;
            padding: 0 8px 0 2px;
            font-size: 12px;
            color: var(--ink-3);
        }
        .class-bar .toolbar-btn { padding: 9px 12px; font-size: 12.5px; }

        /* ── 报告问题按钮 ── */
        .report-btn {
            margin-left: 10px;
            padding: 3px 10px;
            font-family: var(--sans);
            font-size: 11.5px;
            color: var(--ink-2);
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 2px;
            cursor: pointer;
        }
        .report-btn:hover {
            color: #fff;
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .report-area {
            width: 100%;
            min-height: 96px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink);
            border: 1px solid var(--border);
            outline: none;
            resize: vertical;
        }
        .report-area:focus { border-color: var(--accent); border-width: 2px; padding: 7px 9px; }

        .modal-ok {
            min-height: 18px;
            margin-top: 6px;
            font-size: 12px;
            color: #107c10;
        }

        /* 无权限提示 */
        .no-perm {
            text-align: center;
            padding: 72px 20px;
            color: var(--ink-3);
        }
        .no-perm-title {
            font-size: 15px;
            font-weight: 600;
            color: #a4262c;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .no-perm-desc {
            font-size: 12.5px;
            line-height: 1.9;
        }

        .content-area {
            background-color: var(--surface);
            border: none;
            padding: 14px 16px;
            min-height: 460px;
        }

        .wall-meta {
            font-size: 12px;
            color: var(--ink-3);
            padding-bottom: 10px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border-2);
        }

        /* ── 帖子卡片 ── */
        .wall-post {
            background-color: var(--surface);
            border: 1px solid var(--border-2);
            margin: 10px 0;
            box-shadow: none;
        }
        .wall-post:hover { border-color: var(--border); }

        .post-info-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border-2);
        }

        .post-avatar {
            width: 26px;
            height: 26px;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            color: #fff;
            background-color: var(--accent);
            border: none;
            border-radius: 50%;
            overflow: hidden;
        }

        /* 默认小人头像（无自定义头像时） */
        .post-avatar.is-default {
            background-color: #b8b8b8;
        }
        .post-avatar svg {
            width: 70%;
            height: 70%;
            display: block;
            fill: #fff;
        }

        .post-name {
            font-weight: 600;
            color: var(--accent);
        }

        .post-tag {
            padding: 1px 8px;
            font-size: 11px;
            color: var(--ink-2);
            background-color: #f0f0f0;
            border: 1px solid var(--border-2);
        }

        .post-tag.hot { color: #b0344f; background-color: #fdeef1; border-color: #f4ccd6; }
        .post-tag.tree { color: #2c7a52; background-color: #eaf7f0; border-color: #bfe3d0; }

        .post-title-bar {
            padding: 11px 12px 3px;
            font-size: 15px;
            font-weight: 600;
            background-color: transparent;
            border: none;
        }

        .post-content-body {
            padding: 0 12px 11px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-2);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--ink-3);
            border-top: 1px solid var(--border-2);
        }

        .post-actions span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            cursor: pointer;
            user-select: none;
        }
        .post-actions span:hover { color: var(--accent); background-color: var(--accent-l); }
        .post-actions .liked { color: #b0344f; font-weight: 600; }

        .reply-box {
            margin: 0;
            padding: 10px 12px 12px;
            border-top: 1px solid var(--border-2);
            background-color: var(--surface-2);
            display: none;
        }
        .reply-box.open { display: block; }

        .reply-item {
            font-size: 12.5px;
            color: var(--ink-2);
            padding: 4px 0;
            border-bottom: 1px solid var(--border-2);
        }
        .reply-item:last-of-type { border-bottom: none; }
        .reply-item b { color: var(--accent); }

        .reply-input {
            width: calc(100% - 76px);
            padding: 6px 10px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: var(--ink);
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0;
            outline: none;
        }
        .reply-input::placeholder { color: var(--ink-3); }
        .reply-input:focus { border-color: var(--accent); border-width: 2px; padding: 5px 9px; }

        .reply-send {
            margin-left: 6px;
            padding: 6px 18px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: #fff;
            background-color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 0;
            cursor: pointer;
        }
        .reply-send:hover { background-color: var(--accent-d); border-color: var(--accent-d); }

        /* 涂黑文字 */
        .redacted-password {
            background-color: var(--ink);
            color: transparent;
            display: inline-block;
            padding: 0 6px;
            font-weight: bold;
            cursor: default;
            user-select: none;
            height: 1em;
            vertical-align: middle;
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 0;
            padding: 7px 16px;
            font-size: 11.5px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border-top: 1px solid var(--border-2);
        }

        /* ── 电源开关 ── */
        #power-btn {
            position: fixed; bottom: 16px; right: 16px; z-index: 10001;
            padding: 6px 18px;
            font-family: var(--sans); font-size: 12.5px;
            color: var(--ink);
            background-color: #e1e1e1;
            border: 1px solid var(--border);
            border-radius: 0;
            cursor: pointer; user-select: none;
        }
        #power-btn:hover { background-color: #d6d6d6; }
        #power-btn:active { background-color: #cccccc; }

        #power-off {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: none; align-items: center; justify-content: center;
            color: #4a4a4a; font-size: 13px; letter-spacing: 4px;
            font-family: var(--sans);
        }
        #power-off.on { display: flex; }

        /* ── 用户区（标题栏右侧）── */
        .window-buttons { margin-left: auto; }

        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 8px;
            font-size: 12.5px;
            color: var(--ink-2);
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background-color: var(--accent-l);
            color: var(--accent-d);
            border: 1px solid #a9d2f0;
            font-weight: 600;
            max-width: 180px;
        }

        .user-chip .dot {
            width: 7px;
            height: 7px;
            flex: none;
            border-radius: 50%;
            background-color: #107c10;
        }

        .user-chip .uid {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 16px;
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .5px;
            color: #fff;
            background: var(--accent);
            border: 1px solid var(--accent-d);
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .22);
            transition: background .15s, transform .1s, box-shadow .15s;
        }
        .user-link:hover {
            background: var(--accent-d);
            color: #fff;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
        }
        .user-link:active { transform: translateY(1px); }

        /* 已登录时的「退出」用弱化样式，避免抢眼 */
        .user-exit {
            padding: 3px 8px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .user-exit:hover { color: var(--accent); text-decoration: underline; }

        /* ── 登录弹窗 ── */
        .modal-mask {
            position: fixed; inset: 0; z-index: 12000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, .45);
        }
        .modal-mask.on { display: flex; }

        .modal {
            width: 100%;
            max-width: 360px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 36px;
            padding: 0 6px 0 14px;
            border-bottom: 1px solid var(--border-2);
            font-size: 13px;
            font-weight: 600;
        }

        .modal-close {
            width: 34px; height: 30px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px;
            color: var(--ink-2);
            background: transparent; border: none; cursor: pointer;
        }
        .modal-close:hover { background-color: #e81123; color: #fff; }

        .modal-body { padding: 18px 16px 8px; }

        .modal-desc {
            font-size: 12.5px;
            color: var(--ink-3);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .modal-label {
            display: block;
            font-size: 12.5px;
            color: var(--ink-2);
            margin-bottom: 6px;
        }

        .modal-input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 13.5px;
            color: var(--ink);
            background-color: var(--surface);
            border: 1px solid var(--border);
            outline: none;
        }
        .modal-input::placeholder { color: var(--ink-3); }
        .modal-input:focus { border-color: var(--accent); border-width: 2px; padding: 7px 9px; }

        .modal-error {
            min-height: 18px;
            margin-top: 8px;
            font-size: 12px;
            color: #c42b1c;
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 16px 16px;
        }

        .mbtn {
            padding: 7px 20px;
            font-family: var(--sans);
            font-size: 13px;
            border: 1px solid var(--border);
            background-color: #e1e1e1;
            color: var(--ink);
            cursor: pointer;
        }
        .mbtn:hover { background-color: #d6d6d6; }

        .mbtn.primary {
            color: #fff;
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .mbtn.primary:hover { background-color: var(--accent-d); border-color: var(--accent-d); }

        .mbtn.danger {
            color: #a4262c;
            border-color: #e0aeb1;
            background-color: #fdf3f4;
        }
        .mbtn.danger:hover { background-color: #fbe6e8; }

        /* ── 进站公告 ── */
        .notice-text {
            font-size: 13px;
            line-height: 2;
            color: var(--ink);
            white-space: pre-line;
            padding: 2px 0 6px;
        }


        /* ── 响应式 ── */
        @media (max-width: 640px) {
            body { padding: 12px 8px 44px; }
            .xp-window { padding-left: 10px; }
            .window-btn { width: 38px; }
            .user-chip { max-width: 110px; }
            .toolbar { padding: 0 4px; }
            .toolbar-btn { padding: 10px 12px; font-size: 12.5px; }
            .content-area { padding: 12px; }
            .reply-input { width: 100%; }
            .reply-send { width: 100%; margin: 8px 0 0; }
            #power-btn { bottom: 12px; right: 12px; }
        }
    </style>
</head>
<body>

<div id="power-btn" onclick="togglePower()">关闭</div>
<div id="power-off">●  显示器已关闭 — 点击任意处开机</div>

<div class="xp-window">
    <div class="window-title">
        <span class="mode-label">大同中学墙墙 v1.4</span>
        <button class="report-btn" type="button" onclick="openReport()">报告问题</button>
    </div>
    <div class="window-buttons">
        <div class="user-area" id="user-area"></div>
        <div class="window-btn">_</div>
        <div class="window-btn">□</div>
        <div class="window-btn" onclick="togglePower()" style="cursor:pointer;">×</div>
    </div>
</div>

<!-- ── 进站公告弹窗 ── -->
<div class="modal-mask" id="notice-mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="notice-title">
        <div class="modal-head">
            <span id="notice-title">公告</span>
            <button class="modal-close" type="button" onclick="closeNotice()">✕</button>
        </div>
        <div class="modal-body">
            <div class="notice-text">为维护校园信息秩序，即日起，各班级公告、值日表、活动通知统一由班级信息员审核后发布。
未经审核的纸质材料不得张贴于公告栏。
请同学们不信谣、不传谣，共同维护良好的学习环境。</div>
        </div>
        <div class="modal-foot">
            <button class="mbtn primary" type="button" onclick="closeNotice()">我知道了</button>
        </div>
    </div>
</div>

<!-- ── 报告问题弹窗 ── -->
<div class="modal-mask" id="report-mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="report-title">
        <div class="modal-head">
            <span id="report-title">报告问题</span>
            <button class="modal-close" type="button" onclick="closeReport()">✕</button>
        </div>
        <div class="modal-body">
            <textarea class="report-area" id="report-input" maxlength="500"
                      placeholder="请描述你遇到的问题（至少 20 字）…"></textarea>
            <div class="modal-error" id="report-error"></div>
            <div class="modal-ok" id="report-ok"></div>
        </div>
        <div class="modal-foot">
            <button class="mbtn" type="button" onclick="closeReport()">关闭</button>
            <button class="mbtn" id="report-rollback" type="button" style="display:none"
                    onclick="rollbackVersion()">回退旧版本</button>
            <button class="mbtn primary" type="button" onclick="submitReport()">提交</button>
        </div>
    </div>
</div>

<!-- ── 登录 / 注册弹窗 ── -->
<div class="modal-mask" id="login-mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="modal-head">
            <span id="login-title">登录墙墙</span>
            <button class="modal-close" type="button" onclick="closeLogin()">✕</button>
        </div>
        <div class="modal-body">
            <input class="modal-input" id="login-input" type="text" maxlength="16"
                   placeholder="你的 ID" autocomplete="off">
            <input class="modal-input" id="login-pwd" type="password" maxlength="32"
                   placeholder="密码" autocomplete="new-password">
            <div class="modal-error" id="login-error"></div>
        </div>
        <div class="modal-foot">
            <button class="mbtn" type="button" onclick="closeLogin()">取消</button>
            <button class="mbtn primary" type="button" id="login-submit" onclick="submitLogin()">进入</button>
        </div>
    </div>
</div>

<div class="main-content">

<div class="toolbar">
    <button class="toolbar-btn active" onclick="filterWall('all', this)">墙墙</button>
</div>

<!-- ── 班级筛选：一班 ~ 十一班 ── -->
<div class="toolbar class-bar">
    <span class="class-bar-label">班级</span>
    <button class="toolbar-btn cls-btn" onclick="filterClass(0, this)">全部</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(1, this)">一班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(2, this)">二班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(3, this)">三班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(4, this)">四班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(5, this)">五班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(6, this)">六班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(7, this)">七班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(8, this)">八班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(9, this)">九班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(10, this)">十班</button>
    <button class="toolbar-btn cls-btn active" id="cls-11" onclick="filterClass(11, this)">十一班</button>
</div>

<div class="content-area" id="wall">
    <div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · 共 <span id="post-count">0</span> 条留言</div>
    <!-- 帖子由 JS 渲染 -->
</div>

<div class="statusbar">
    <span id="status-text">就绪</span>
    <span>大同中学墙墙 · 最后更新：<span id="now-date"></span></span>
</div>

</div>

<script>
/* ── 初始示例留言（呼应 logs 世界观，但偏日常闲聊）── */
var SEED_POSTS = [
    { name:'高二（3）小苏', tag:'chat', avatar:'', title:'课间操过了十分钟才响铃 结果还要整队出操 何意味',
            content:'课间操过了十分钟才响铃 结果还要整队出操 何意味',

var TAG_LABEL = { chat:'日常闲聊', love:'表白墙', tree:'树洞', lost:'失物招领' };
var STORE_KEY = 'xyzh_wall_posts_v2';
var USER_KEY = 'xyzh_wall_user_v1';
// 改 SEED_POSTS 后把下面这个数字 +1，页面会自动丢弃旧缓存、改用 HTML 里的新帖子
var SEED_VERSION = 10;

/* ══ 账号（本地保存，仅当前浏览器有效）══ */
function loadUser(){
    try {
        var raw = localStorage.getItem(USER_KEY);
        if(!raw) return null;
        var u = JSON.parse(raw);
        return (u && u.id) ? u : null;
    } catch(e){ return null; }
}
function saveUser(u){
    try {
        if(u) localStorage.setItem(USER_KEY, JSON.stringify(u));
        else localStorage.removeItem(USER_KEY);
    } catch(e){}
}

var currentUser = loadUser();

function isLoggedIn(){ return !!(currentUser && currentUser.id); }

function renderUserArea(){
    var el = document.getElementById('user-area');
    if(!el) return;
    if(isLoggedIn()){
        el.innerHTML =
            '<span class="user-chip"><span class="dot"></span>'+
                '<span class="uid">'+escapeHtml(currentUser.id)+'</span></span>'+
            '<button class="user-exit" type="button" onclick="doLogout()">退出</button>';
    } else {
        el.innerHTML = '<button class="user-link" type="button" onclick="openLogin()">👤 登录 / 注册</button>';
    }
}

function openLogin(){
    var mask = document.getElementById('login-mask');
    var inp = document.getElementById('login-input');
    var pwd = document.getElementById('login-pwd');
    var err = document.getElementById('login-error');
    var btn = document.getElementById('login-submit');
    var title = document.getElementById('login-title');
    if(!mask) return;
    err.textContent = '';
    inp.value = isLoggedIn() ? currentUser.id : '';
    if(pwd) pwd.value = '';
    title.textContent = isLoggedIn() ? '修改 ID' : '登录墙墙';
    btn.textContent = isLoggedIn() ? '保存' : '进入';
    mask.classList.add('on');
    setTimeout(function(){ inp.focus(); inp.select(); }, 30);
}

function closeLogin(){
    var mask = document.getElementById('login-mask');
    if(mask) mask.classList.remove('on');
}

/* ── 进站公告：每次打开页面都先弹出 ── */
function openNotice(){
    var mask = document.getElementById('notice-mask');
    if(mask) mask.classList.add('on');
}
function closeNotice(){
    var mask = document.getElementById('notice-mask');
    if(mask) mask.classList.remove('on');
}

function submitLogin(){
    var inp = document.getElementById('login-input');
    var pwdInp = document.getElementById('login-pwd');
    var err = document.getElementById('login-error');
    var id = (inp.value || '').trim().replace(/\s+/g, ' ');
    var pwd = pwdInp ? (pwdInp.value || '') : '';

    if(!id){ err.textContent = '请输入你的 ID。'; inp.focus(); return; }
    if(id.length < 2){ err.textContent = 'ID 至少 2 个字符。'; inp.focus(); return; }
    if(id.length > 16){ err.textContent = 'ID 最多 16 个字符。'; inp.focus(); return; }
    if(!/^[\w\u4e00-\u9fa5（）()·\-\s]+$/.test(id)){
        err.textContent = 'ID 只能包含中英文、数字、空格和常用符号。';
        inp.focus(); return;
    }
    // 首次登录必须设置密码；已登录状态下修改 ID 时留空即表示不修改
    if(!isLoggedIn()){
        if(!pwd){ err.textContent = '请输入密码。'; if(pwdInp) pwdInp.focus(); return; }
        if(pwd.length < 4){ err.textContent = '密码至少 4 位。'; if(pwdInp) pwdInp.focus(); return; }
    }

    currentUser = { id: id, since: (currentUser && currentUser.since) || nowStr() };
    saveUser(currentUser);
    renderUserArea();
    closeLogin();
    setStatus('已登录：' + id);
}

function doLogout(){
    if(!confirm('确定要退出登录吗？')) return;
    currentUser = null;
    saveUser(null);
    renderUserArea();
    setStatus('已退出登录');
}

    closeReport();

function submitReport(){
    var inp = document.getElementById('report-input');
    var err = document.getElementById('report-error');
    var ok = document.getElementById('report-ok');
    var rb = document.getElementById('report-rollback');
    if(!inp) return;
    var text = (inp.value || '').trim();
    if(!text){ if(err) err.textContent = '请先描述你遇到的问题。'; inp.focus(); return; }
    if(text.length < 20){
        if(err) err.textContent = '请至少填写 20 字再提交（当前 ' + text.length + ' 字）。';
        if(ok) ok.textContent = '';
        inp.focus(); return;
    }
    if(err) err.textContent = '';
    try {
        var list = JSON.parse(localStorage.getItem(REPORT_KEY) || '[]');
        if(!Array.isArray(list)) list = [];
        list.push({
            text: text,
            user: currentUser ? currentUser.id : '匿名',
            at: nowStr()
        });
        localStorage.setItem(REPORT_KEY, JSON.stringify(list));
    } catch(e){}
    // 提交成功后不关闭窗口，露出「回退旧版本」按钮
    if(ok) ok.textContent = '提交成功，感谢反馈';
    if(rb) rb.style.display = 'inline-block';
    setStatus('问题已提交，可选择「回退旧版本」');
}

/* 未登录时拦下操作，弹出登录框 */
function requireLogin(){
    if(isLoggedIn()) return true;
    var err = document.getElementById('login-error');
    openLogin();
    if(err) err.textContent = '请先输入 ID 登录后再发言。';
    return false;
}

function loadPosts(){
    try {
        var raw = localStorage.getItem(STORE_KEY);
        if(raw){
            var data = JSON.parse(raw);
            // 旧格式（纯数组）或版本不符 → 视为失效，回退到 HTML 的 SEED_POSTS
            if(data && data._v === SEED_VERSION && Array.isArray(data.posts)) return data.posts;
        }
    } catch(e){}
    return null;
}
function savePosts(posts){
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ _v: SEED_VERSION, posts: posts })); } catch(e){}
}

/* ── 为一组帖子生成「确定且彼此不同」的时间戳：按 5 天范围内均匀分布 ── */
function makeFixedTimes(count){
    var arr = [], now = Date.now();
    var span = 5 * 24 * 60 * 60 * 1000; // 5 天
    for(var i = 0; i < count; i++){
        // 每隔 (span/count) 一个时刻，再加点儿分钟偏移以避免整点
        var step = Math.floor(span / (count + 1));
        var minutes = (i * 47) % 60; // 0~59 分钟
        arr.push(now - (step * (count - i)) - minutes * 60 * 1000);
    }
    return arr;
}

var posts = (function(){
    var loaded = loadPosts();
    if(loaded) {
        var times = makeFixedTimes(loaded.length);
        // 老数据没有班级字段 → 统一归入十一班
        loaded.forEach(function(p, i){
            if(!p.createdAt) p.createdAt = times[i];
            if(!p.cls) p.cls = 11;
        });
        return loaded;
    }
    var times = makeFixedTimes(SEED_POSTS.length);
    return SEED_POSTS.map(function(p, i){
        p.id = 'seed_'+(i+1);
        p.createdAt = times[i];
        p.cls = 11;          // 现有所有帖子都属于十一班
        return p;
    });
})();

function nowStr(){
    var d = new Date();
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

function formatTime(ts){
    var d = new Date(ts);
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function relativeTime(ts){
    var diff = Math.floor((Date.now()-ts)/60000);
    if(diff<1) return '刚刚';
    if(diff<60) return diff+' 分钟前';
    if(diff<1440) return Math.floor(diff/60)+' 小时前';
    return Math.floor(diff/1440)+' 天前';
}

var currentFilter = 'all';
var currentClass = 11;   // 0 = 全部班级；1~11 = 对应班级（默认十一班）
var DEFAULT_CLASS = 11;  // 现有全部帖子归入十一班
var ALLOWED_CLASS = 11;  // 仅有权限查看的班级，其余班级点击后显示「无权限」
var CLASS_NAMES = ['','一班','二班','三班','四班','五班','六班','七班','八班','九班','十班','十一班'];

function renderWall(){
    var wall = document.getElementById('wall');
    var clsLabel = currentClass ? CLASS_NAMES[currentClass] : '全部班级';
    var meta = '<div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · '+
               '当前：'+clsLabel+' · 共 <span id="post-count">'+posts.length+'</span> 条留言</div>';
    var html = meta;
    // 无权限班级：不显示任何内容
    if(currentClass !== ALLOWED_CLASS){
        wall.innerHTML = meta +
            '<div class="no-perm">'+
                '<div class="no-perm-title">无权限</div>'+
                '<div class="no-perm-desc">你没有查看'+(currentClass ? CLASS_NAMES[currentClass] : '全部班级')+
                '内容的权限。<br>如需访问，请联系班级信息员开通权限。</div>'+
            '</div>';
        var pc2 = document.getElementById('post-count');
        if(pc2) pc2.textContent = '0';
        return;
    }
    var shown = 0;
    for(var i=0;i<posts.length;i++){
        var p = posts[i];
        if(currentFilter!=='all' && p.tag!==currentFilter) continue;
        if(currentClass && (Number(p.cls) || DEFAULT_CLASS) !== currentClass) continue;
        shown++;
        var tagCls = p.tag==='love' ? 'post-tag hot' : (p.tag==='tree' ? 'post-tag tree' : 'post-tag');
        var repliesHtml = '';
        if(p.replies && p.replies.length){
            for(var r=0;r<p.replies.length;r++){
                repliesHtml += '<div class="reply-item"><b>'+escapeHtml(p.replies[r].n)+'：</b>'+escapeHtml(p.replies[r].t)+'</div>';
            }
        }
        html +=
        '<div class="wall-post" data-id="'+p.id+'">'+
            '<div class="post-info-bar">'+
                avatarHtml(p.avatar)+
                '<span class="post-name">'+escapeHtml(p.name)+'</span>'+
                '<span class="'+tagCls+'">'+TAG_LABEL[p.tag]+'</span>'+
                '<span style="margin-left:auto;">🕒 '+formatTime(p.createdAt)+' · '+relativeTime(p.createdAt)+'</span>'+
            '</div>'+
            '<div class="post-title-bar">'+escapeHtml(p.title)+'</div>'+
            '<div class="post-content-body">'+escapeHtml(p.content)+'</div>'+
            '<div class="post-actions">'+
                '<span class="like-btn" onclick="likePost(\''+p.id+'\', this)">👍 赞 <b>'+p.likes+'</b></span>'+
                '<span onclick="toggleReply(\''+p.id+'\')">💬 回复 ('+(p.replies?p.replies.length:0)+')</span>'+
            '</div>'+
            '<div class="reply-box" id="rb_'+p.id+'">'+ repliesHtml +
                '<div style="margin-top:6px;"><input class="reply-input" id="ri_'+p.id+'" placeholder="回一句……" maxlength="80">'+
                '<button class="reply-send" onclick="addReply(\''+p.id+'\')">发送</button></div>'+
            '</div>'+
        '</div>';
    }
    if(shown===0){
        html += '<div style="text-align:center;color:#999;padding:40px 0;">这个分类暂时还没有留言，快来抢沙发～</div>';
    }
    wall.innerHTML = html;
    var pc = document.getElementById('post-count');
    if(pc) pc.textContent = posts.length;
}

function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
}

/* 头像：统一使用默认小人图标 */
var DEFAULT_AVATAR_SVG =
    '<svg viewBox="0 0 24 24" aria-hidden="true">'+
    '<circle cx="12" cy="8" r="4"/>'+
    '<path d="M12 14c-4.4 0-8 2.7-8 6v1h16v-1c0-3.3-3.6-6-8-6z"/>'+
    '</svg>';

function avatarHtml(){
    return '<span class="post-avatar is-default">'+DEFAULT_AVATAR_SVG+'</span>';
}

function likePost(id, el){
    for(var i=0;i<posts.length;i++){
        if(posts[i].id===id){
            if(el.dataset.liked==='1'){ posts[i].likes--; el.dataset.liked='0'; el.classList.remove('liked'); }
            else { posts[i].likes++; el.dataset.liked='1'; el.classList.add('liked'); }
            el.innerHTML='👍 赞 <b>'+posts[i].likes+'</b>';
            savePosts(posts);
            return;
        }
    }
}

function toggleReply(id){
    var box = document.getElementById('rb_'+id);
    if(box) box.classList.toggle('open');
}

function addReply(id){
    if(!requireLogin()) return;
    var inp = document.getElementById('ri_'+id);
    var t = inp.value.trim();
    if(!t) return;
    for(var i=0;i<posts.length;i++){
        if(posts[i].id===id){
            if(!posts[i].replies) posts[i].replies=[];
            posts[i].replies.push({n: currentUser.id, t:t});
            savePosts(posts);
            break;
        }
    }
    setStatus('已以 ' + currentUser.id + ' 的身份发表评论');
    renderWall();
}

function filterWall(type, btn){
    currentFilter = type;
    currentClass = ALLOWED_CLASS;   // 回到「墙墙」时恢复为有权限的班级
    document.querySelectorAll('.toolbar-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    var defCls = document.getElementById('cls-11');
    if(defCls) defCls.classList.add('active');
    renderWall();
}

/* 切换班级：0=全部，1~11=对应班级 */
function filterClass(cls, btn){
    currentClass = cls;
    document.querySelectorAll('.cls-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    renderWall();
    if(cls !== ALLOWED_CLASS){
        setStatus('无权限：无法查看' + (cls ? CLASS_NAMES[cls] : '全部班级'));
    } else {
        setStatus('已切换到 ' + CLASS_NAMES[cls]);
    }
}

function setStatus(t){ var s=document.getElementById('status-text'); if(s) s.textContent=t; }

function togglePower(){
    var po = document.getElementById('power-off');
    po.classList.add('on');
}
document.getElementById('power-off').addEventListener('click', function(){
    this.classList.remove('on');
});

document.getElementById('now-date').textContent = nowStr().slice(0,10);

renderUserArea();
renderWall();
openNotice();

/* 登录弹窗交互：回车提交、ESC 关闭、点遮罩关闭 */
document.getElementById('login-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submitLogin(); }
    if(e.key === 'Escape'){ closeLogin(); }
});
document.getElementById('login-pwd').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); submitLogin(); }

});

});
document.getElementById('notice-mask').addEventListener('click', function(e){

});
document.getElementById('report-mask').addEventListener('click', function(e){

});

        '.virus-breach.show{opacity:.88;}',
        'body.vglitch{animation:vshake .26s steps(3) 1;}',
        '@keyframes vshake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}',
        '50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0,0)}}',
        '.virus-noise{position:fixed;inset:0;pointer-events:none;z-index:99997;overflow:hidden;}',
        '.virus-nblock{position:absolute;color:#ff2b2b;font-family:Consolas,"Courier New",monospace;',
        'font-size:12px;line-height:1.15;white-space:pre;overflow:hidden;opacity:0;',
        'padding:2px 4px;background:transparent;text-shadow:0 0 6px rgba(255,0,0,.6);',
        'transition:opacity .14s linear;}',
        '.virus-nblock.show{opacity:.78;animation:vflicker .19s steps(2) infinite;}',
        '.virus-stop{color:#fff;font-weight:700;letter-spacing:1px;',
        'text-shadow:0 0 10px rgba(255,0,0,.95),0 0 20px rgba(255,0,0,.6);}',
        '.virus-prog{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);',
        'opacity:0;transition:opacity .18s linear;white-space:nowrap;}',
        '.virus-prog.show{opacity:1;}',
        '.virus-prog-label{color:#ff2b2b;font-family:var(--sans);font-size:13px;}'
    ].join('');
    var st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);

    var fx = document.createElement('div');
    fx.id = 'virus-fx';
    document.body.appendChild(fx);
    var flash = document.createElement('div');
    flash.id = 'virus-flash';
    document.body.appendChild(flash);

    var POOL = [
        'WARN: unauthorized access detected',
        'root@wall:~# rm -rf /var/wall/posts/*',
        '0xDEADBEEF  SEGFAULT at 0x08048a3f',
        'EXFILTRATING ███████░░░ 73%',
        'kernel panic - not syncing: fatal exception',
        'TRACE 114.514.191.981 → TARGET PORT 443',
        'DECRYPTING student_records.db ...',
        'ACCESS GRANTED // uid=0(root) gid=0(root)',
        'payload injected @ 0x7fff5a3c2b10',
        'kill -9 $(pgrep firewall)',
        'bypassing auth layer 3/3 ... OK',
        'MEMORY CORRUPTION @ 0xC0000005',
        'id_rsa → remote_host : data leaked',
        '正在上传 墙墙数据库 ... 请勿断电',
        'connection reset by peer — retrying',
        'SYSTEM BREACH :: 数据泄露中',
        'overwriting /home/wall/index ...done',
        '[!] 检测到未知脚本注入 wall.js',
        '锟斤拷锟斤拷锟斤拷 ERROR 0xFFFD',
        '烫烫烫烫烫烫烫烫 [stack smashing detected]',
        '屯屯屯屯屯屯 内存已被覆写 ▓▒░',
        '锘锘锘 UNICODE REPLACEMENT 0xEFBFBD',
        '▓▒░ SECTOR CORRUPT ░▒▓ 无法读取',
        '编码错误 //// //// ████ 0x80070057',
        '屯屯屯锟斤拷烫烫烫 ??? not utf-8'
    ];

    var enabled = true, timer = null;

    function pick(){
        var n = 1 + Math.floor(Math.random()*3);
        var out = [], used = {};
        while(out.length < n){
            var i = Math.floor(Math.random()*POOL.length);
            if(!used[i]){ used[i] = 1; out.push(POOL[i]); }
        }
        return out.join('\n');
    }

    function showCode(){
        var el = document.createElement('div');
        el.className = 'virus-code';
        el.textContent = pick();
        var w = Math.min(window.innerWidth - 40, 360);
        var h = Math.min(window.innerHeight - 40, 160);
        el.style.left = Math.floor(Math.random()*(window.innerWidth - w)) + 'px';
        el.style.top = Math.floor(Math.random()*(window.innerHeight - h)) + 'px';
        fx.appendChild(el);
        requestAnimationFrame(function(){ el.classList.add('show'); });
        setTimeout(function(){
            el.classList.remove('show');
            setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
        }, 420 + Math.random()*900);
    }

    function scanBar(){
        var bar = document.createElement('div');
        bar.className = 'virus-bar';
        bar.style.top = (Math.random()*window.innerHeight) + 'px';
        fx.appendChild(bar);
        var start = Date.now(), dur = 520;
        (function step(){
            var p = (Date.now()-start)/dur;
            if(p >= 1){ if(bar.parentNode) bar.parentNode.removeChild(bar); return; }
            bar.style.transform = 'translateY(' + (Math.sin(p*Math.PI*3)*60) + 'px)';
            bar.style.opacity = String(0.85*(1-p));
            requestAnimationFrame(step);
        })();
    }

    function doFlash(){
        flash.classList.add('on');
        setTimeout(function(){ flash.classList.remove('on'); }, 90 + Math.random()*160);
    }

    function doGlitch(){
        document.body.classList.add('vglitch');
        setTimeout(function(){ document.body.classList.remove('vglitch'); }, 280);
    }

    function doBreach(){
        var el = document.createElement('div');
        el.className = 'virus-breach';
        el.textContent = 'SYSTEM BREACH';
        fx.appendChild(el);
        requestAnimationFrame(function(){ el.classList.add('show'); });
        setTimeout(function(){
            el.classList.remove('show');
            setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 200);
        }, 500 + Math.random()*500);
    }

    /* ── 乱码遮罩：铺满整屏、fixed 定位不随页面滚动 ── */
    var noise = document.createElement('div');
    noise.className = 'virus-noise';
    document.body.appendChild(noise);
    var noiseTimer = null;

    var GB = ('锟斤拷烫屯锘铪锟斤拷乱码烫屯锘' +
              'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789' +
              'アカサタナハマヤラワヲンヰヱ' +
              '▓▒░█▚▞░▒▓◆◇※§¶×÷±≠∞▲▼◢◣' +
              '{}[]<>/\\|!@#$%^&*()_+-=?~');
    /* 间断出现的「停下」多语种词组 */
    var STOP_WORDS = [
        '停下', '停止', '停下来', '别继续了', '住手', 'STOP', 'stop', 'Stop!',
        '止まれ', 'ストップ', '멈춰', '그만', 'Arrête', 'Halte',
        'Halt', 'Anhalten', 'Fermati', 'Basta', 'Pare', 'Alto',
        'Parada', 'Стоп', 'Остановись', 'توقف', 'Dur', 'Durun',
        'Dừng lại', 'หยุด', 'Berhenti', 'hentikan', 'Stadt', 'Staph'
    ];

    function garbled(len){
        var s = '';
        for(var i = 0; i < len; i++) s += GB.charAt(Math.floor(Math.random()*GB.length));
        return s;
    }
    function esc(s){
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function paintNoise(){
        if(!enabled) return;
        noise.innerHTML = '';
        var n = 2 + Math.floor(Math.random()*4);           // 2~5 小块
        for(var i = 0; i < n; i++){
            var w = 90 + Math.random()*190;                // 宽 90~280
            var h = 30 + Math.random()*80;                 // 高 30~110
            var lines = Math.max(2, Math.floor(h / 15));
            var cols = Math.max(8, Math.floor(w / 7));
            var b = document.createElement('div');
            b.className = 'virus-nblock';
            b.style.width = w + 'px';
            b.style.height = h + 'px';
            b.style.left = Math.floor(Math.random() * Math.max(1, window.innerWidth - w)) + 'px';
            b.style.top = Math.floor(Math.random() * Math.max(1, window.innerHeight - h)) + 'px';
            // 约一半的块会混入「停下 / stop」多语种词组，间断出现
            var wordMode = Math.random() < 0.5;
            var w1 = STOP_WORDS[Math.floor(Math.random()*STOP_WORDS.length)];
            var out = [];
            for(var r = 0; r < lines; r++){
                var line = garbled(cols);
                if(wordMode && Math.random() < 0.5){
                    var pos = Math.floor(Math.random() * Math.max(1, cols - w1.length - 2));
                    out.push(esc(line.slice(0, pos)) +
                             '<span class="virus-stop">' + esc(w1) + '</span>' +
                             esc(line.slice(pos + w1.length)));
                } else {
                    out.push(esc(line));
                }
            }
            // 偶尔整行都是这个词，形成一句重复的警告
            if(wordMode && lines >= 3 && Math.random() < 0.4){
                var mid = Math.floor(lines / 2), rep = '';
                var cnt = Math.max(1, Math.floor(cols / (w1.length + 2)));
                for(var q = 0; q < cnt; q++) rep += '<span class="virus-stop">' + esc(w1) + '</span>  ';
                out[mid] = rep;
            }
            b.innerHTML = out.join('\n');
            noise.appendChild(b);
            // 出现后保持常驻，不再消失
            (function(el, d){ setTimeout(function(){ el.classList.add('show'); }, d); })(b, i * (50 + Math.random()*160));
            // 数量过多时移除最早的一块，避免堆满整屏（上限 18 块）
            while(noise.children.length > 18 && noise.firstChild){
                noise.removeChild(noise.firstChild);
            }
        }
    }
    function noiseLoop(){
        paintNoise();
        noiseTimer = setTimeout(noiseLoop, 6500 + Math.random()*9000);
    }

    /* ── 清除进度条：每 20 秒出现一次，进度递增 ── */
    var cleanPct = 13, progEl = null, progTimer = null;

    function showProgress(){
        if(!enabled) return;
        if(!progEl){
            progEl = document.createElement('div');
            progEl.className = 'virus-prog';
            progEl.innerHTML = '<div class="virus-prog-label"></div>';
            document.body.appendChild(progEl);
        }
        var label = progEl.querySelector('.virus-prog-label');
        label.textContent = '清除进度：13%';
        progEl.classList.add('show');
        setTimeout(function(){
            progEl.classList.remove('show');
        }, 2600);
        progTimer = setTimeout(showProgress, 20000);
    }

    function burst(){
        if(!enabled) return;
        // 一次爆发同时弹出 2~4 个代码块
        var n = 2 + Math.floor(Math.random()*3);
        for(var i = 0; i < n; i++){
            (function(d){ setTimeout(showCode, d); })(i * (40 + Math.random()*180));
        }
        if(Math.random() < 0.8) doFlash();
        if(Math.random() < 0.55) doGlitch();
        // 1~2 条扫描线
        var bars = Math.random() < 0.6 ? (1 + Math.floor(Math.random()*2)) : 0;
        for(var b = 0; b < bars; b++){
            (function(d){ setTimeout(scanBar, d); })(b * (120 + Math.random()*260));
        }
        if(Math.random() < 0.3) doBreach();
        if(Math.random() < 0.5) paintNoise();
        // 偶尔连锁触发，制造「密集爆发」的错觉
        if(Math.random() < 0.35) setTimeout(burst, 300 + Math.random()*700);
        schedule();
    }

    function schedule(){
        clearTimeout(timer);
        timer = setTimeout(burst, 2000 + Math.random()*5000);
    }

    document.addEventListener('keydown', function(e){
        if(e.ctrlKey && e.altKey && (e.key === 'v' || e.key === 'V')){
            enabled = !enabled;
            if(!enabled){
                fx.innerHTML = '';
                flash.classList.remove('on');
                noise.classList.remove('show');
                noise.textContent = '';
                if(progEl) progEl.classList.remove('show');
                clearTimeout(timer); clearTimeout(progTimer); clearTimeout(noiseTimer);
            } else {
                schedule();
                progTimer = setTimeout(showProgress, 4000);
                noiseLoop();
            }
        }
    });

    schedule();
    progTimer = setTimeout(showProgress, 2500);
    noiseTimer = setTimeout(noiseLoop, 3500);
})();
