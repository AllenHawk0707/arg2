<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大同中学墙墙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, "宋体", SimSun, sans-serif;
            font-size: 12px;
            background-color: #ece9d8;
            color: #000;
            margin: 0;
            padding: 46px;
            min-height: 100vh;
        }

        .xp-window {
            background-color: #0054e3;
            color: #fff;
            padding: 4px 6px;
            font-weight: bold;
            font-size: 13px;
            border: 2px solid #0055ea;
            border-bottom: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .window-icon {
            width: 16px;
            height: 16px;
            background-color: #ffcc00;
            border: 1px solid #000;
        }

        .window-buttons {
            display: flex;
            gap: 2px;
        }

        .window-btn {
            width: 21px;
            height: 21px;
            background-color: #316ac5;
            border: 1px solid #0054e3;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            line-height: 19px;
            font-size: 14px;
        }

        .window-btn:hover {
            background-color: #4a90e2;
        }

        .main-content {
            background-color: #fff;
            border: 2px solid #0055ea;
            border-top: none;
            min-height: 600px;
            padding: 10px;
        }

        .toolbar {
            background-color: #ece9d8;
            border: 1px solid #aca899;
            padding: 4px;
            margin-bottom: 10px;
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            padding: 4px 12px;
            background-color: #f5f5f5;
            border: 1px solid #aca899;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            font-size: 11px;
            min-width: 80px;
            text-align: center;
        }

        .toolbar-btn:hover {
            background-color: #316ac5;
            color: #fff;
            border: 1px solid #00218c;
        }

        .toolbar-btn.active {
            background-color: #316ac5;
            color: #fff;
            border: 1px solid #00218c;
            border-right: 1px solid #0a246a;
            border-bottom: 1px solid #0a246a;
        }

        .content-area {
            background-color: #fff;
            border: 1px inset #808080;
            padding: 15px;
            min-height: 460px;
        }

        .wall-meta {
            font-size: 11px;
            color: #666;
            margin-bottom: 10px;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 6px;
        }

        /* 闲聊墙帖子卡片（沿用 logs 的 forum-post-style 语言） */
        .wall-post {
            background-color: #f5f5f5;
            border: 1px solid #ccc;
            margin: 10px 0;
            box-shadow: 1px 1px 0 #fff inset;
        }

        .post-info-bar {
            background-color: #e8eef7;
            padding: 5px 10px;
            font-size: 11px;
            color: #666;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .post-avatar {
            width: 22px;
            height: 22px;
            background-color: #ccc;
            border: 1px outset #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .post-name {
            font-weight: bold;
            color: #00008b;
        }

        .post-tag {
            background-color: #ffffcc;
            border: 1px solid #cccc99;
            padding: 0 5px;
            font-size: 10px;
        }

        .post-tag.hot { background-color: #ffe0e0; border-color: #d9a0a0; color: #a00; }
        .post-tag.tree { background-color: #e8f5e8; border-color: #a8c8a8; color: #2a7a2a; }

        .post-title-bar {
            padding: 8px 10px;
            font-weight: bold;
            font-size: 12px;
            background-color: #fff;
            border-bottom: 1px solid #eee;
        }

        .post-content-body {
            padding: 10px;
            font-size: 12px;
            line-height: 1.8;
            color: #444;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-actions {
            padding: 6px 10px;
            border-top: 1px dashed #ccc;
            font-size: 11px;
            color: #555;
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .post-actions span { cursor: pointer; user-select: none; }
        .post-actions span:hover { color: #316ac5; }
        .post-actions .liked { color: #c0392b; font-weight: bold; }

        .reply-box {
            margin: 6px 10px 10px 10px;
            border-top: 1px dashed #ddd;
            padding-top: 8px;
            display: none;
        }
        .reply-box.open { display: block; }
        .reply-item {
            font-size: 11px;
            color: #555;
            padding: 4px 0;
            border-bottom: 1px dotted #eee;
        }
        .reply-item b { color: #00008b; }
        .reply-input {
            width: calc(100% - 70px);
            border: 2px inset #808080;
            padding: 3px 6px;
            font-family: Tahoma, sans-serif;
            font-size: 12px;
        }
        .reply-send {
            padding: 3px 12px;
            background-color: #e1e1e1;
            border: 2px outset #fff;
            cursor: pointer;
            font-family: Tahoma, sans-serif;
            font-size: 11px;
        }
        .reply-send:hover { background-color: #316ac5; color: #fff; }

        /* 涂黑文字 */
        .redacted-password {
            background-color: #000;
            color: transparent;
            display: inline-block;
            padding: 0 6px;
            font-weight: bold;
            cursor: default;
            user-select: none;
            height: 1em;
            vertical-align: middle;
        }

        .statusbar {
            background-color: #ece9d8;
            border-top: 1px solid #fff;
            padding: 4px 8px;
            font-size: 11px;
            color: #333;
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        /* ── CRT 老式电脑特效 ── */
        html { filter: saturate(0.5) contrast(0.9) blur(0.3px); }
        #crt-noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9998; opacity: 0.22;
            mix-blend-mode: screen; image-rendering: pixelated;
        }
        #crt-flash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9997; background: transparent;
            transition: background 0.05s;
        }
        #monitor-frame {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 10000; box-sizing: border-box;
            border: 46px solid #262626; border-radius: 26px; background: transparent;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03), inset 0 0 0 3px #151515,
                inset 0 0 0 5px #343434, inset 0 0 0 6px #111, 0 0 0 4px #1c1c1c,
                0 0 0 6px #363636, 0 0 0 8px #131313, 0 0 60px rgba(0,0,0,0.7);
        }
        #monitor-frame::before {
            content: '大同';
            position: fixed; bottom: 11px; left: 50%; transform: translateX(-50%);
            color: #3d3d3d; font-size: 11px; font-family: "宋体", SimSun, serif;
            letter-spacing: 8px; z-index: 10001; pointer-events: none;
        }
        #monitor-frame::after {
            content: ''; position: fixed; bottom: 14px; right: 84px;
            width: 6px; height: 6px; background: #3f3; border-radius: 50%;
            box-shadow: 0 0 8px #3f3, 0 0 16px #3f3; z-index: 10001;
        }
        #power-btn {
            position: fixed; bottom: 7px; right: 18px; z-index: 10001;
            pointer-events: auto; cursor: pointer;
            background: linear-gradient(180deg, #3d3d3d, #1e1e1e); color: #777;
            border: 1px solid #151515; border-top-color: #444; border-left-color: #3a3a3a;
            padding: 4px 16px; font-family: "宋体", SimSun, serif; font-size: 11px;
            letter-spacing: 3px; border-radius: 3px; user-select: none; text-align: center;
            box-shadow: 0 1px 0 rgba(255,255,255,0.04);
        }
        #power-btn:hover { color: #bbb; background: linear-gradient(180deg, #4a4a4a, #282828); }
        #power-btn:active { background: linear-gradient(180deg, #1a1a1a, #2a2a2a); color: #555; box-shadow: none; transform: translateY(1px); }
        #power-off {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: none; align-items: center; justify-content: center;
            color: #2a2a2a; font-size: 13px; letter-spacing: 4px; font-family: "宋体",serif;
        }
        #power-off.on { display: flex; }
    </style>
</head>
<body>

<canvas id="crt-noise"></canvas>
<div id="crt-flash"></div>
<div id="monitor-frame"></div>
<div id="power-btn" onclick="togglePower()">关闭</div>
<div id="power-off">●  显示器已关闭 — 点击任意处开机</div>

<div class="xp-window">
    <div class="window-title">
        <div class="window-icon"></div>
        <span class="mode-label">大同中学墙墙 v1.0</span>
    </div>
    <div class="window-buttons">
        <div class="window-btn">_</div>
        <div class="window-btn">□</div>
        <div class="window-btn" onclick="togglePower()" style="cursor:pointer;">×</div>
    </div>
</div>

<div class="main-content">

<div class="toolbar">
    <button class="toolbar-btn active" onclick="filterWall('all', this)">墙墙</button>
   
</div>

<div class="content-area" id="wall">
    <div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · 共 <span id="post-count">0</span> 条留言</div>
    <!-- 帖子由 JS 渲染 -->
</div>

<div class="statusbar">
    <span id="status-text">就绪</span>
    <span>大同中学墙墙 · 最后更新：<span id="now-date"></span></span>
</div>

</div>

<script>
/* ── 初始示例留言（呼应 logs 世界观，但偏日常闲聊）── */
var SEED_POSTS = [
    { name:'高二（3）小苏', tag:'chat', avatar:'', title:'课间操过了十分钟才响铃 结果还要整队出操 何意味',
            content:'课间操过了十分钟才响铃 结果还要整队出操 何意味',
            likes:12, replies:[] },
    { name:'高二（4） Kevin', tag:'tree', avatar:'🌫', title:'篮球来单挑',
      content:'打爆全世界',
      likes:34, replies:[{n:'GYF',t:'老弟你叫啥呢'}] },
    { name:' YZX', tag:'chat', avatar:'', title:'好想念原十一班的同学们',
      content:'怎么就分班了啊，我们十一班怎么就没了。\n 我就和WJY和孙孙在一个班 好无聊',
      likes:8, replies:[{n:'子轩子轩',t:'你们在几班啊 我在9班'}] },
    { name:'昂子胡', tag:'chat', avatar:'', title:'吐槽一下学校的离谱校规',
      content:'莫名奇妙的分班 把我和好朋友都拆散了\n什么时候大家一起聚一下？',
      likes:56, replies:[{n:'1140',t:'我们小理科管的好严啊 感觉没时间'}] },
    { name:'Bowen SUN', tag:'chat', avatar:'？？', title:'我们班好多凯文',
      content:'和郑凯文分到一个班了\n结果这个班还有个赵和罗\n蚌埠不住',
      likes:89, replies:[{n:'思远思齐',t:'什么鬼，原来我们班有这么多凯文 我还以为之前听错了'},{n:'LYH',t:'啊 你们在四班吗'}] },
    { name:'小朱', tag:'chat', avatar:'🕯', title:'好讨厌小团体',
      content:'家人们谁懂啊 和小团体分到一个班了\nZSH，CXY和LYT这三个人\n到底在干些什么，天天聚在一起吵',
      likes:21, replies:[{n:'WJY',t:'听说HJJ和ZWB也在你们班啊 他们怎么样了'},{n:'Wenbo Zhou',t:'不 我们两个在二班 \n和林SQ，李MJ在一个班'}] },
    { name:'1145', tag:'chat', avatar:'👧', title:'我们班好像有人阳了',
      content:'怎么到现在还有人生病啊喂',
      likes:17, replies:[{n:'梦见瑶瑶',t:'好吓人'}] },
    { name:' YaJing', tag:'chat', avatar:'', title:'我的东西',
      content:'完蛋了 我还有好多东西落在教室柜子里\n不会被收了吧',
      likes:2, replies:[{n:'zrt',t:'听说现在被当成走班教室了 \n 不知道你的东西还在不在'}] },
    { name:' 晨间曦光', tag:'chat', avatar:'', title:'怎么没人',
      content:'人好少啊 是不是墙刚开 看看明天会不会更新',
      likes:1, replies:[] }
];

var TAG_LABEL = { chat:'日常闲聊', love:'表白墙', tree:'树洞', lost:'失物招领' };
var STORE_KEY = 'xyzh_wall_posts_v2';

function loadPosts(){
    try {
        var raw = localStorage.getItem(STORE_KEY);
        if(raw) return JSON.parse(raw);
    } catch(e){}
    return null;
}
function savePosts(posts){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(posts)); } catch(e){}
}

var posts = loadPosts() || SEED_POSTS.map(function(p){ p.id = 'seed_'+Math.random().toString(36).slice(2); return p; });

function nowStr(){
    var d = new Date();
    function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

var currentFilter = 'all';

function renderWall(){
    var wall = document.getElementById('wall');
    var meta = '<div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · 共 <span id="post-count">'+posts.length+'</span> 条留言</div>';
    var html = meta;
    var shown = 0;
    for(var i=0;i<posts.length;i++){
        var p = posts[i];
        if(currentFilter!=='all' && p.tag!==currentFilter) continue;
        shown++;
        var tagCls = p.tag==='love' ? 'post-tag hot' : (p.tag==='tree' ? 'post-tag tree' : 'post-tag');
        var repliesHtml = '';
        if(p.replies && p.replies.length){
            for(var r=0;r<p.replies.length;r++){
                repliesHtml += '<div class="reply-item"><b>'+escapeHtml(p.replies[r].n)+'：</b>'+escapeHtml(p.replies[r].t)+'</div>';
            }
        }
        html +=
        '<div class="wall-post" data-id="'+p.id+'">'+
            '<div class="post-info-bar">'+
                '<span class="post-avatar">'+p.avatar+'</span>'+
                '<span class="post-name">'+escapeHtml(p.name)+'</span>'+
                '<span class="'+tagCls+'">'+TAG_LABEL[p.tag]+'</span>'+
                '<span style="margin-left:auto;">🕒 '+nowStr()+'</span>'+
            '</div>'+
            '<div class="post-title-bar">'+escapeHtml(p.title)+'</div>'+
            '<div class="post-content-body">'+escapeHtml(p.content)+'</div>'+
            '<div class="post-actions">'+
                '<span class="like-btn" onclick="likePost(\''+p.id+'\', this)">👍 赞 <b>'+p.likes+'</b></span>'+
                '<span onclick="toggleReply(\''+p.id+'\')">💬 回复 ('+(p.replies?p.replies.length:0)+')</span>'+
            '</div>'+
            '<div class="reply-box" id="rb_'+p.id+'">'+ repliesHtml +
                '<div style="margin-top:6px;"><input class="reply-input" id="ri_'+p.id+'" placeholder="回一句……" maxlength="80">'+
                '<button class="reply-send" onclick="addReply(\''+p.id+'\')">发送</button></div>'+
            '</div>'+
        '</div>';
    }
    if(shown===0){
        html += '<div style="text-align:center;color:#999;padding:40px 0;">这个分类暂时还没有留言，快来抢沙发～</div>';
    }
    wall.innerHTML = html;
    var pc = document.getElementById('post-count');
    if(pc) pc.textContent = posts.length;
}

function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
}

function likePost(id, el){
    for(var i=0;i<posts.length;i++){
        if(posts[i].id===id){
            if(el.dataset.liked==='1'){ posts[i].likes--; el.dataset.liked='0'; el.classList.remove('liked'); }
            else { posts[i].likes++; el.dataset.liked='1'; el.classList.add('liked'); }
            el.innerHTML='👍 赞 <b>'+posts[i].likes+'</b>';
            savePosts(posts);
            return;
        }
    }
}

function toggleReply(id){
    var box = document.getElementById('rb_'+id);
    if(box) box.classList.toggle('open');
}

function addReply(id){
    var inp = document.getElementById('ri_'+id);
    var t = inp.value.trim();
    if(!t) return;
    for(var i=0;i<posts.length;i++){
        if(posts[i].id===id){
            if(!posts[i].replies) posts[i].replies=[];
            posts[i].replies.push({n:'我', t:t});
            savePosts(posts);
            break;
        }
    }
    renderWall();
}

function filterWall(type, btn){
    currentFilter = type;
    document.querySelectorAll('.toolbar-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    renderWall();
}

function setStatus(t){ var s=document.getElementById('status-text'); if(s) s.textContent=t; }

function togglePower(){
    var po = document.getElementById('power-off');
    po.classList.add('on');
}
document.getElementById('power-off').addEventListener('click', function(){
    this.classList.remove('on');
});

document.getElementById('now-date').textContent = nowStr().slice(0,10);

renderWall();

/* ── 涂黑文字块：用宽度遮住原文字 ── */
document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('.redacted-password').forEach(function(el){
        var len = el.textContent.length;
        el.textContent='';
        var w = Math.max(len*10,14);
        el.style.width=w+'px'; el.style.minWidth=w+'px';
    });
});
</script>

<!-- ── CRT 雪花屏噪点 + 间歇闪屏（沿用 logs 特效）── -->
<script>
(function(){
    var cv=document.getElementById('crt-noise');
    var cx=cv.getContext('2d');
    var w,h,sw,sh,imgData,data;
    function resize(){
        w=cv.width=window.innerWidth; h=cv.height=window.innerHeight;
        sw=Math.ceil(w/4); sh=Math.ceil(h/4);
        imgData=cx.createImageData(sw,sh); data=imgData.data;
    }
    resize(); window.addEventListener('resize',resize);
    function noise(){
        for(var i=0;i<data.length;i+=4){
            var v=Math.random()<0.13?200+Math.random()*55:0;
            data[i]=v; data[i+1]=v; data[i+2]=v; data[i+3]=255;
        }
        cx.putImageData(imgData,0,0);
        cx.drawImage(cv,0,0,sw,sh,0,0,w,h);
        cx.fillStyle='rgba(0,0,0,0.16)';
        for(var y=0;y<sh;y+=4) cx.fillRect(0,y*(h/sh),w,2*(h/sh));
        if(Math.random()<0.04){
            cx.fillStyle='rgba(255,255,255,'+(0.04+Math.random()*0.08)+')';
            cx.fillRect(0,Math.floor(Math.random()*h),w,1+Math.random()*3);
        }
        requestAnimationFrame(noise);
    }
    noise();
    var flash=document.getElementById('crt-flash');
    function scheduleFlash(){
        var delay=3000+Math.random()*15000;
        setTimeout(function(){
            flash.style.background='rgba(255,255,255,'+(0.06+Math.random()*0.15)+')';
            setTimeout(function(){ flash.style.background='transparent'; scheduleFlash(); },40+Math.random()*60);
        },delay);
    }
    scheduleFlash();
})();
</script>

</body>
</html>
