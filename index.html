<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大同中学墙墙</title>
    <style>
        /* ══ Windows 10 Fluent ══ */
        :root {
            --accent: #0078d7;
            --accent-d: #0063b1;
            --accent-l: #cce4f7;
            --bg: #f2f2f2;
            --surface: #ffffff;
            --surface-2: #fafafa;
            --border: #d2d2d2;
            --border-2: #e5e5e5;
            --ink: #1f1f1f;
            --ink-2: #555555;
            --ink-3: #8a8a8a;
            --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--bg);
            margin: 0 auto;
            padding: 24px 16px 48px;
            max-width: 920px;
            min-height: 100vh;
        }

        /* ── 标题栏 ── */
        .xp-window {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 32px;
            padding: 0 0 0 12px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--ink);
        }

        .window-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            font-weight: 400;
        }

        .window-buttons {
            display: flex;
            align-self: stretch;
        }

        .window-btn {
            width: 45px;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            font-size: 10px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            cursor: pointer;
        }

        .window-btn:hover { background-color: #e5e5e5; }
        .window-btn:last-child:hover { background-color: #e81123; color: #fff; }

        /* ── 主面板 ── */
        .main-content {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            min-height: 600px;
            padding: 0 0 1px;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            align-items: stretch;
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border-2);
            padding: 0 8px;
        }

        .toolbar-btn {
            padding: 11px 16px;
            font-family: var(--sans);
            font-size: 13px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            cursor: pointer;
        }

        .toolbar-btn:hover {
            color: var(--ink);
            background-color: #f0f0f0;
        }

        .toolbar-btn.active {
            color: var(--accent);
            font-weight: 600;
            border-bottom-color: var(--accent);
        }

        /* 班级筛选栏 */
        .class-bar {
            padding: 0 8px 0 4px;
            background-color: var(--surface);
        }
        .class-bar-label {
            display: flex;
            align-items: center;
            padding: 0 8px 0 2px;
            font-size: 12px;
            color: var(--ink-3);
        }
        .class-bar .toolbar-btn { padding: 9px 12px; font-size: 12.5px; }

        /* ── 报告问题按钮 ── */
        .report-btn {
            margin-left: 10px;
            padding: 3px 10px;
            font-family: var(--sans);
            font-size: 11.5px;
            color: var(--ink-2);
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 2px;
            cursor: pointer;
        }
        .report-btn:hover {
            color: #fff;
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .report-area {
            width: 100%;
            min-height: 96px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink);
            border: 1px solid var(--border);
            outline: none;
            resize: vertical;
        }
        .report-area:focus { border-color: var(--accent); border-width: 2px; padding: 7px 9px; }

        .modal-ok {
            min-height: 18px;
            margin-top: 6px;
            font-size: 12px;
            color: #107c10;
        }

        /* 无权限提示 */
        .no-perm {
            text-align: center;
            padding: 72px 20px;
            color: var(--ink-3);
        }
        .no-perm-title {
            font-size: 15px;
            font-weight: 600;
            color: #a4262c;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .no-perm-desc {
            font-size: 12.5px;
            line-height: 1.9;
        }

        .content-area {
            background-color: var(--surface);
            border: none;
            padding: 14px 16px;
            min-height: 460px;
        }

        .wall-meta {
            font-size: 12px;
            color: var(--ink-3);
            padding-bottom: 10px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border-2);
        }

        /* ── 帖子卡片 ── */
        .wall-post {
            background-color: var(--surface);
            border: 1px solid var(--border-2);
            margin: 10px 0;
            box-shadow: none;
        }
        .wall-post:hover { border-color: var(--border); }

        .post-info-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border-bottom: 1px solid var(--border-2);
        }

        .post-avatar {
            width: 26px;
            height: 26px;
            flex: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            color: #fff;
            background-color: var(--accent);
            border: none;
            border-radius: 50%;
            overflow: hidden;
        }

        /* 默认小人头像（无自定义头像时） */
        .post-avatar.is-default {
            background-color: #b8b8b8;
        }
        .post-avatar svg {
            width: 70%;
            height: 70%;
            display: block;
            fill: #fff;
        }

        .post-name {
            font-weight: 600;
            color: var(--accent);
        }

        .post-tag {
            padding: 1px 8px;
            font-size: 11px;
            color: var(--ink-2);
            background-color: #f0f0f0;
            border: 1px solid var(--border-2);
        }

        .post-tag.hot { color: #b0344f; background-color: #fdeef1; border-color: #f4ccd6; }
        .post-tag.tree { color: #2c7a52; background-color: #eaf7f0; border-color: #bfe3d0; }

        .post-title-bar {
            padding: 11px 12px 3px;
            font-size: 15px;
            font-weight: 600;
            background-color: transparent;
            border: none;
        }

        .post-content-body {
            padding: 0 12px 11px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--ink-2);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--ink-3);
            border-top: 1px solid var(--border-2);
        }

        .post-actions span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            cursor: pointer;
            user-select: none;
        }
        .post-actions span:hover { color: var(--accent); background-color: var(--accent-l); }
        .post-actions .liked { color: #b0344f; font-weight: 600; }

        .reply-box {
            margin: 0;
            padding: 10px 12px 12px;
            border-top: 1px solid var(--border-2);
            background-color: var(--surface-2);
            display: none;
        }
        .reply-box.open { display: block; }

        .reply-item {
            font-size: 12.5px;
            color: var(--ink-2);
            padding: 4px 0;
            border-bottom: 1px solid var(--border-2);
        }
        .reply-item:last-of-type { border-bottom: none; }
        .reply-item b { color: var(--accent); }

        .reply-input {
            width: calc(100% - 76px);
            padding: 6px 10px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: var(--ink);
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0;
            outline: none;
        }
        .reply-input::placeholder { color: var(--ink-3); }
        .reply-input:focus { border-color: var(--accent); border-width: 2px; padding: 5px 9px; }

        .reply-send {
            margin-left: 6px;
            padding: 6px 18px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: #fff;
            background-color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 0;
            cursor: pointer;
        }
        .reply-send:hover { background-color: var(--accent-d); border-color: var(--accent-d); }

        /* 涂黑文字 */
        .redacted-password {
            background-color: var(--ink);
            color: transparent;
            display: inline-block;
            padding: 0 6px;
            font-weight: bold;
            cursor: default;
            user-select: none;
            height: 1em;
            vertical-align: middle;
        }

        .statusbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 0;
            padding: 7px 16px;
            font-size: 11.5px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border-top: 1px solid var(--border-2);
        }

        /* ── 电源开关 ── */
        #power-btn {
            position: fixed; bottom: 16px; right: 16px; z-index: 10001;
            padding: 6px 18px;
            font-family: var(--sans); font-size: 12.5px;
            color: var(--ink);
            background-color: #e1e1e1;
            border: 1px solid var(--border);
            border-radius: 0;
            cursor: pointer; user-select: none;
        }
        #power-btn:hover { background-color: #d6d6d6; }
        #power-btn:active { background-color: #cccccc; }

        #power-off {
            position: fixed; inset: 0; background: #000; z-index: 11000;
            display: none; align-items: center; justify-content: center;
            color: #4a4a4a; font-size: 13px; letter-spacing: 4px;
            font-family: var(--sans);
        }
        #power-off.on { display: flex; }

        /* ── 用户区（标题栏右侧）── */
        .window-buttons { margin-left: auto; }

        .user-area {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-right: 8px;
            font-size: 12.5px;
            color: var(--ink-2);
        }

        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            background-color: var(--accent-l);
            color: var(--accent-d);
            border: 1px solid #a9d2f0;
            font-weight: 600;
            max-width: 180px;
        }

        .user-chip .dot {
            width: 7px;
            height: 7px;
            flex: none;
            border-radius: 50%;
            background-color: #107c10;
        }

        .user-chip .uid {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 16px;
            font-family: var(--sans);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .5px;
            color: #fff;
            background: var(--accent);
            border: 1px solid var(--accent-d);
            border-radius: 3px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .22);
            transition: background .15s, transform .1s, box-shadow .15s;
        }
        .user-link:hover {
            background: var(--accent-d);
            color: #fff;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .28);
        }
        .user-link:active { transform: translateY(1px); }

        /* 已登录时的「退出」用弱化样式，避免抢眼 */
        .user-exit {
            padding: 3px 8px;
            font-family: var(--sans);
            font-size: 12.5px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .user-exit:hover { color: var(--accent); text-decoration: underline; }

        /* ── 登录弹窗 ── */
        .modal-mask {
            position: fixed; inset: 0; z-index: 12000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: rgba(0, 0, 0, .45);
        }
        .modal-mask.on { display: flex; }

        .modal {
            width: 100%;
            max-width: 360px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 36px;
            padding: 0 6px 0 14px;
            border-bottom: 1px solid var(--border-2);
            font-size: 13px;
            font-weight: 600;
        }

        .modal-close {
            width: 34px; height: 30px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px;
            color: var(--ink-2);
            background: transparent; border: none; cursor: pointer;
        }
        .modal-close:hover { background-color: #e81123; color: #fff; }

        .modal-body { padding: 18px 16px 8px; }

        .modal-desc {
            font-size: 12.5px;
            color: var(--ink-3);
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .modal-label {
            display: block;
            font-size: 12.5px;
            color: var(--ink-2);
            margin-bottom: 6px;
        }

        .modal-input {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px 10px;
            font-family: var(--sans);
            font-size: 13.5px;
            color: var(--ink);
            background-color: var(--surface);
            border: 1px solid var(--border);
            outline: none;
        }
        .modal-input::placeholder { color: var(--ink-3); }
        .modal-input:focus { border-color: var(--accent); border-width: 2px; padding: 7px 9px; }

        .modal-error {
            min-height: 18px;
            margin-top: 8px;
            font-size: 12px;
            color: #c42b1c;
        }

        .modal-foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px 16px 16px;
        }

        .mbtn {
            padding: 7px 20px;
            font-family: var(--sans);
            font-size: 13px;
            border: 1px solid var(--border);
            background-color: #e1e1e1;
            color: var(--ink);
            cursor: pointer;
        }
        .mbtn:hover { background-color: #d6d6d6; }

        .mbtn.primary {
            color: #fff;
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .mbtn.primary:hover { background-color: var(--accent-d); border-color: var(--accent-d); }

        .mbtn.danger {
            color: #a4262c;
            border-color: #e0aeb1;
            background-color: #fdf3f4;
        }
        .mbtn.danger:hover { background-color: #fbe6e8; }

        /* ── 进站公告 ── */
        .notice-text {
            font-size: 13px;
            line-height: 2;
            color: var(--ink);
            white-space: pre-line;
            padding: 2px 0 6px;
        }


        /* ── 响应式 ── */
        @media (max-width: 640px) {
            body { padding: 12px 8px 44px; }
            .xp-window { padding-left: 10px; }
            .window-btn { width: 38px; }
            .user-chip { max-width: 110px; }
            .toolbar { padding: 0 4px; }
            .toolbar-btn { padding: 10px 12px; font-size: 12.5px; }
            .content-area { padding: 12px; }
            .reply-input { width: 100%; }
            .reply-send { width: 100%; margin: 8px 0 0; }
            #power-btn { bottom: 12px; right: 12px; }
        }
    </style>
</head>
<body>

<div id="power-btn" onclick="togglePower()">关闭</div>
<div id="power-off">●  显示器已关闭 — 点击任意处开机</div>

<div class="xp-window">
    <div class="window-title">
        <span class="mode-label">大同中学墙墙 v1.4</span>
        <button class="report-btn" type="button" onclick="openReport()">报告问题</button>
    </div>
    <div class="window-buttons">
        <div class="user-area" id="user-area"></div>
        <div class="window-btn">_</div>
        <div class="window-btn">□</div>
        <div class="window-btn" onclick="togglePower()" style="cursor:pointer;">×</div>
    </div>
</div>

<!-- ── 进站公告弹窗 ── -->
<div class="modal-mask" id="notice-mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="notice-title">
        <div class="modal-head">
            <span id="notice-title">公告</span>
            <button class="modal-close" type="button" onclick="closeNotice()">✕</button>
        </div>
        <div class="modal-body">
            <div class="notice-text">为维护校园信息秩序，即日起，各班级公告、值日表、活动通知统一由班级信息员审核后发布。
未经审核的纸质材料不得张贴于公告栏。
请同学们不信谣、不传谣，共同维护良好的学习环境。</div>
        </div>
        <div class="modal-foot">
            <button class="mbtn primary" type="button" onclick="closeNotice()">我知道了</button>
        </div>
    </div>
</div>

<!-- ── 报告问题弹窗 ── -->
<div class="modal-mask" id="report-mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="report-title">
        <div class="modal-head">
            <span id="report-title">报告问题</span>
            <button class="modal-close" type="button" onclick="closeReport()">✕</button>
        </div>
        <div class="modal-body">
            <textarea class="report-area" id="report-input" maxlength="500"
                      placeholder="请描述你遇到的问题…"></textarea>
            <div class="modal-error" id="report-error"></div>
            <div class="modal-ok" id="report-ok"></div>
        </div>
        <div class="modal-foot">
            <button class="mbtn" type="button" onclick="closeReport()">关闭</button>
            <button class="mbtn" id="report-rollback" type="button" style="display:none"
                    onclick="rollbackVersion()">回退旧版本</button>
            <button class="mbtn primary" type="button" onclick="submitReport()">提交</button>
        </div>
    </div>
</div>

<!-- ── 登录 / 注册弹窗 ── -->
<div class="modal-mask" id="login-mask">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="modal-head">
            <span id="login-title">登录墙墙</span>
            <button class="modal-close" type="button" onclick="closeLogin()">✕</button>
        </div>
        <div class="modal-body">
            <input class="modal-input" id="login-input" type="text" maxlength="16"
                   placeholder="你的 ID" autocomplete="off">
            <input class="modal-input" id="login-pwd" type="password" maxlength="32"
                   placeholder="密码" autocomplete="new-password">
            <div class="modal-error" id="login-error"></div>
        </div>
        <div class="modal-foot">
            <button class="mbtn" type="button" onclick="closeLogin()">取消</button>
            <button class="mbtn primary" type="button" id="login-submit" onclick="submitLogin()">进入</button>
        </div>
    </div>
</div>

<div class="main-content">

<div class="toolbar">
    <button class="toolbar-btn active" onclick="filterWall('all', this)">墙墙</button>
</div>

<!-- ── 班级筛选：一班 ~ 十一班 ── -->
<div class="toolbar class-bar">
    <span class="class-bar-label">班级</span>
    <button class="toolbar-btn cls-btn active" onclick="filterClass(0, this)">全部</button>
    <button class="toolbar-btn cls-btn" id="cls-1" onclick="filterClass(1, this)">一班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(2, this)">二班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(3, this)">三班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(4, this)">四班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(5, this)">五班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(6, this)">六班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(7, this)">七班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(8, this)">八班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(9, this)">九班</button>
    <button class="toolbar-btn cls-btn" onclick="filterClass(10, this)">十班</button>
    <button class="toolbar-btn cls-btn" id="cls-11" style="display:none" onclick="filterClass(11, this)">十一班</button>
</div>

<div class="content-area" id="wall">
    <div class="wall-meta">欢迎来到大同中学墙墙 · 匿名发布 · 文明发言 · 共 <span id="post-count">0</span> 条留言</div>
    <!-- 帖子由 JS 渲染 -->
</div>

<div class="statusbar">
    <span id="status-text">就绪</span>
    <span>大同中学墙墙 · 最后更新：<span id="now-date"></span></span>
