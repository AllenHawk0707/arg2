<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>秦主任办公室</title>
<style>
    :root {
        --accent: #0078d7;
        --accent-d: #0063b1;
        --surface: #ffffff;
        --border: #d2d2d2;
        --border-2: #e5e5e5;
        --ink: #1f1f1f;
        --ink-2: #555555;
        --ink-3: #8a8a8a;
        --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
        font-family: var(--sans);
        font-size: 13px;
        color: var(--ink);
        background: #05070a;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    #scene { display: block; width: 100%; height: 100%; cursor: grab; }
    #scene.locked { cursor: none; }
    #scene.dragging { cursor: grabbing; }

    /* ── 顶栏：压暗，尽量不破坏夜视感 ── */
    .topbar {
        position: fixed; top: 10px; left: 10px; right: 10px;
        display: flex; align-items: center; gap: 10px;
        height: 32px; padding: 0 4px 0 12px;
        background: rgba(9, 11, 15, .7);
        border: 1px solid #1c2028;
        backdrop-filter: blur(6px);
        pointer-events: auto;
        z-index: 8;
        opacity: .82;
        transition: opacity .4s ease;
    }
    .topbar:hover { opacity: 1; }
    .topbar .t { font-size: 12px; letter-spacing: .3px; color: #7f868e; }
    .topbar .dot { width: 7px; height: 7px; border-radius: 50%; background: #7a1f1f; margin-right: 2px; box-shadow: 0 0 7px #a82929; }
    .topbar .spacer { flex: 1; }
    .btn {
        height: 26px; padding: 0 12px;
        font-family: var(--sans); font-size: 12px;
        color: #8d949c; background: rgba(18, 21, 26, .9);
        border: 1px solid #262b33; cursor: pointer;
    }
    .btn:hover { background: #1a1e24; color: #c7ced5; }
    .btn.primary { color: #ccd4dc; background: #1b222c; border-color: #2c3542; }
    .btn.primary:hover { background: #232c38; }
    a.btn { display: inline-flex; align-items: center; text-decoration: none; }

    /* ── 暗角 / 噪点层 ── */
    #vig {
        position: fixed; inset: 0; z-index: 6; pointer-events: none;
        background:
            radial-gradient(ellipse 76% 66% at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,.58) 78%, rgba(0,0,0,.95) 100%),
            linear-gradient(rgba(6,12,22,.10), rgba(1,3,7,.18));
    }
    #flick { position: fixed; inset: 0; z-index: 7; pointer-events: none; background: #cfe0f5; opacity: 0; }

    /* ── 开场字幕（自动淡出） ── */
    #intro {
        position: fixed; inset: 0; z-index: 9;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px; text-align: center; pointer-events: none;
        color: #aab3bd; letter-spacing: 3px;
        text-shadow: 0 0 18px rgba(0,0,0,.9);
        transition: opacity 2.4s ease;
    }
    #intro .l1 { font-size: 15px; }
    #intro .l2 { font-size: 12px; color: #626a73; letter-spacing: 2px; line-height: 2.1; }
    #intro.gone { opacity: 0; }

    /* ── 遮罩 ── */
    #mask {
        position: fixed; inset: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #05070a;
        transition: opacity .9s ease;
    }
    #mask.hide { opacity: 0; pointer-events: none; }
    #mask .title { font-size: 14px; color: #aab3bd; letter-spacing: 2px; }
    #mask .sub { font-size: 12px; color: #5a6169; }
    .spinner {
        width: 22px; height: 22px; border: 2px solid var(--border);
        border-top-color: var(--accent); border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #err { max-width: 520px; padding: 0 20px; font-size: 12.5px; line-height: 1.8; color: #a4262c; text-align: center; display: none; }

    /* 黑幕上的声音选项 */
    #blackout .sndpick {
        display: flex; align-items: center; gap: 9px;
        font-size: 11.5px; color: #6b7480; letter-spacing: 2px;
    }
    #blackout .sndpick .btn { height: 25px; padding: 0 15px; font-size: 11.5px; }
    #blackout .sndpick small { font-size: 10.5px; color: #4e555d; letter-spacing: 1px; }

    /* ── 录像画面滤镜：整页压一层「正在录制」的摄像机质感 ── */
    #recfx { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
    #recfx .lines {                     /* 扫描线 */
        position: absolute; inset: 0;
        background: repeating-linear-gradient(
            to bottom, rgba(0, 0, 0, .22) 0 1px, rgba(0, 0, 0, 0) 1px 3px);
        mix-blend-mode: multiply;
    }
    #recfx .roll {                      /* 缓慢下滚的一条亮带（老摄像机的滚动条） */
        position: absolute; left: 0; right: 0; height: 22%;
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, rgba(200, 220, 255, .05) 50%, rgba(255, 255, 255, 0) 100%);
        animation: recRoll 7.5s linear infinite;
    }
    @keyframes recRoll { from { top: -25%; } to { top: 105%; } }
    #recfx .tint {                      /* 偏冷的色调 + 四角压暗 */
        position: absolute; inset: 0;
        background:
            radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, .55) 100%),
            linear-gradient(to bottom, rgba(60, 110, 160, .07), rgba(10, 20, 30, .12));
    }
    #recfx .glitch {                    /* 偶尔撕裂一下 */
        position: absolute; left: 0; right: 0; height: 0; opacity: 0;
        background: rgba(190, 220, 255, .5); mix-blend-mode: overlay;
    }
    #recfx .rec {                       /* 左上角 REC（做大，像摄像机屏幕上的录制标记） */
        position: absolute; top: 46px; left: 18px;
        display: flex; align-items: center; gap: 12px;
        font: 700 26px/1 "Microsoft YaHei", sans-serif; letter-spacing: 5px;
        color: #f2e4e4; text-shadow: 0 0 10px #000, 0 0 22px rgba(217, 75, 75, .55);
    }
    #recfx .rec i {
        width: 20px; height: 20px; border-radius: 50%; background: #e04b4b;
        box-shadow: 0 0 14px #e04b4b, 0 0 30px rgba(224, 75, 75, .6);
        animation: recBlink 1.4s steps(1, end) infinite;
    }
    @keyframes recBlink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .12; } }
    #recfx .mic {                       /* 右侧的录音电平表：摄像机在记录你有多吵 */
        position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: flex-end; gap: 7px;
        font: 600 10px/1 "Courier New", monospace; letter-spacing: 1px;
        color: #9aa3ac; text-shadow: 0 0 6px #000;
    }
    #recfx .mic .lb { writing-mode: vertical-rl; letter-spacing: 3px; color: #7d858e; }
    #recfx .mic .trk {
        position: relative; width: 11px; height: 156px;
        background: #0a0e13; border: 1px solid #1d242c; overflow: hidden;
    }
    #recfx .mic .trk i {
        position: absolute; left: 0; right: 0; bottom: 0; height: 0;
        background: #6f8a6f; transition: height .06s linear, background .2s linear;
    }
    #recfx .mic .trk i.warn { background: #c9a04a; }
    #recfx .mic .trk i.bad { background: #d24b4b; }
    #recfx .mic .trk b {                       /* 峰值保持：那一格会慢慢掉下来 */
        position: absolute; left: 0; right: 0; bottom: 0; height: 3px; z-index: 2;
        background: #e8eef4; opacity: .85;
    }
    #recfx .mic .trk::after {                  /* 切成一格一格的 LED 段 */
        content: ''; position: absolute; inset: 0;
        background: repeating-linear-gradient(to top, rgba(0, 0, 0, 0) 0 6px, #06090c 6px 8px);
    }
    #recfx .mic .sc {
        display: flex; flex-direction: column; justify-content: space-between;
        height: 156px;                       /* 0 在上，-40 在下 */
    }
    #recfx .mic .sc span { color: #5e666f; font-size: 9px; }
    @media (max-width: 640px) {
        #recfx .mic .trk { height: 96px; }
        #recfx .mic .sc { height: 96px; }
    }
    #recfx .zoom {                      /* 变焦读数：跟着焦距一起走 */
        position: absolute; top: 86px; left: 20px;
        font: 600 13px/1 "Courier New", monospace; letter-spacing: 2px;
        color: #dfe6ec; text-shadow: 0 0 8px #000; opacity: .9;
    }
    #recfx .tc {                        /* 时间码 */
        position: absolute; bottom: 14px; left: 14px;
        font: 400 12px/1 "Courier New", monospace; letter-spacing: 1.5px;
        color: #cfd6dd; text-shadow: 0 0 6px #000; opacity: .85;
    }
    #recfx .tc small { display: block; margin-top: 5px; font-size: 10px; color: #8b939c; letter-spacing: 1px; }
    @media (max-width: 640px) {
        #recfx .tc small { display: none; }
    }

    /* ── 开局黑幕 ── */
    #blackout {
        position: fixed; inset: 0; z-index: 30; background: #000;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; text-align: center; padding: 0 26px;
        color: #c9d1d9; transition: opacity 1.2s ease;
    }
    #blackout.show { display: flex; }
    #blackout.gone { opacity: 0; pointer-events: none; }
    #blackout .ln {
        font-size: 15px; letter-spacing: 2px; line-height: 2; opacity: 0;
        transition: opacity .9s ease; text-shadow: 0 0 20px #000;
    }
    #blackout .ln.on { opacity: 1; }
    #blackout .ln small { display: block; margin-top: 8px; font-size: 12px; color: #6b7480; letter-spacing: 3px; }
    #blackout .skip { position: absolute; bottom: 26px; font-size: 11px; color: #4a5158; letter-spacing: 2px; }

    /* 声音关着的时候，按钮别长得跟开着一样 */
    .btn.off { color: #c08a4a; border-color: #46361f; background: rgba(30, 22, 10, .55); }

    /* ── 顶部提示条 ── */
    #toast {
        position: fixed; left: 50%; top: 58px; transform: translateX(-50%); z-index: 26;
        max-width: 74vw; padding: 9px 16px; text-align: center;
        background: rgba(9, 11, 15, .88); border: 1px solid #262b33;
        color: #c3cbd3; font-size: 12.5px; line-height: 1.7; letter-spacing: .6px;
        opacity: 0; transition: opacity .35s ease; pointer-events: none;
    }
    #toast.on { opacity: 1; }
    #toast.bad { color: #e39a94; border-color: #4a2626; }

    /* ── 通用面板（看文件 / 看屏幕 / 监控） ── */
    #panel {
        position: fixed; inset: 0; z-index: 22; display: none;
        align-items: center; justify-content: center; background: rgba(2, 3, 5, .82);
        backdrop-filter: blur(3px);
    }
    #panel.on { display: flex; }
    #panel .card {
        width: min(720px, 92vw); max-height: 82vh; overflow: auto;
        background: #0d1116; border: 1px solid #232a33; padding: 22px 24px;
        color: #c2cad2; font-size: 13px; line-height: 1.95; letter-spacing: .5px;
    }
    #panel h3 { font-size: 14px; color: #dfe5eb; letter-spacing: 2px; margin-bottom: 4px; font-weight: 600; }
    #panel .sub { font-size: 11.5px; color: #6b7480; margin-bottom: 16px; }
    #panel .doc {
        background: #f6f3ea; color: #232323; padding: 18px 20px; margin: 12px 0;
        border: 1px solid #d8d3c4; line-height: 2; white-space: pre-wrap;
        font-family: "Microsoft YaHei", sans-serif;
    }
    #panel .doc.red { color: #8e1c1c; }
    /* 夹在文件里的照片 */
    #panel .photo { margin: 14px 0 6px; border: 1px solid #232a33; background: #05070a; }
    #panel .photo img { display: block; width: 100%; height: auto; }
    #panel .photo figcaption {
        padding: 8px 10px; font-size: 11.5px; color: #6b7480;
        letter-spacing: 1px; border-top: 1px solid #1d232a;
    }
    #panel .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    #panel .acts .btn { height: 30px; }
    /* 浏览器窗口（被防火墙拦截的那一页） */
    .browser { background: #10151b; border: 1px solid #2a323c; }
    .browser .bar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: #171d25; border-bottom: 1px solid #2a323c; }
    .browser .dot3 { width: 9px; height: 9px; border-radius: 50%; background: #3a424c; }
    .browser .url { flex: 1; height: 22px; background: #0c1116; border: 1px solid #2a323c; color: #7f8a95; font-size: 11px; padding: 0 8px; line-height: 20px; overflow: hidden; white-space: nowrap; }
    .browser .body { padding: 26px 22px; text-align: center; }
    .browser .body .big { font-size: 26px; color: #d8dee5; letter-spacing: 3px; margin-bottom: 10px; }
    .browser .body .msg { color: #8b939c; font-size: 12.5px; line-height: 2.1; }
    .browser .body .stamp { display: inline-block; margin-top: 14px; padding: 8px 14px; border: 2px solid #8e2b22; color: #c9564c; letter-spacing: 2px; transform: rotate(-3deg); }
    /* 监控屏 */
    .moni { display: flex; flex-direction: column-reverse; gap: 4px; }
    .moni .fl { display: flex; align-items: center; gap: 10px; padding: 4px 8px; background: #0f141a; border: 1px solid #1e242c; font-size: 12px; }
    .moni .fl .n { width: 34px; color: #7f8a95; }
    .moni .fl .track { flex: 1; height: 10px; background: #080b0f; position: relative; }
    .moni .fl .track i { position: absolute; top: -3px; width: 8px; height: 16px; background: #6b7f96; transition: left .4s linear; }
    .moni .fl.here { border-color: #3d4a58; background: #131a21; }
    .moni .fl.here .n { color: #c6ced6; }
    .moni .fl .tag { width: 46px; text-align: right; color: #6b7480; font-size: 11px; }

    /* ── 密码键盘 ── */
    #pad {
        position: fixed; inset: 0; z-index: 23; display: none;
        align-items: center; justify-content: center; background: rgba(2, 3, 5, .84);
    }
    #pad.on { display: flex; }
    #pad .box { width: 280px; background: #0d1116; border: 1px solid #232a33; padding: 20px; text-align: center; }
    #pad .disp {
        height: 46px; line-height: 44px; background: #070a0e; border: 1px solid #222933;
        color: #d7dee5; font-size: 24px; letter-spacing: 12px; margin-bottom: 6px;
    }
    #pad .disp.err { color: #d1584f; border-color: #4a2626; }
    #pad .disp.ok { color: #7fb47a; border-color: #264a2a; }
    #pad .hint { font-size: 11px; color: #6b7480; margin-bottom: 14px; letter-spacing: 1px; }
    #pad .hint.err { color: #c9564c; }
    #pad .hint.ok { color: #7fb47a; }
    /* 密码不对：抖一下 */
    @keyframes padShake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-7px); }
        45% { transform: translateX(6px); }
        70% { transform: translateX(-4px); }
        88% { transform: translateX(3px); }
    }
    #pad .box.shake { animation: padShake .3s ease; }
    #pad .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    #pad .keys button {
        height: 42px; background: #151b22; border: 1px solid #262c35; color: #c2cad2;
        font-size: 15px; cursor: pointer; font-family: var(--sans);
    }
    #pad .keys button:hover { background: #1d242c; }
    #pad .keys button.k { background: #182029; color: #8b939c; font-size: 12px; }

    /* ── 长按进度（上发条） ── */
    #hold {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 11;
        width: 220px; text-align: center; display: none; pointer-events: none;
    }
    #hold.on { display: block; }
    #hold .t { font-size: 12px; color: #c2cad2; letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 0 10px #000; }
    #hold .bar { height: 6px; background: rgba(10, 13, 18, .8); border: 1px solid #2a323c; }
    #hold .bar i { display: block; height: 100%; width: 0; background: #7f93aa; }

    /* ── 结局 ── */
    #over {
        position: fixed; inset: 0; z-index: 28; display: none;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #05070a; text-align: center; padding: 0 24px;
    }
    #over.on { display: flex; }
    #over .t1 { font-size: 26px; letter-spacing: 10px; color: #d9dde2; }
    #over .t2 { font-size: 13px; letter-spacing: 2px; color: #7b838c; line-height: 2.1; max-width: 560px; }
    #over .t3 { font-size: 11.5px; color: #4e555d; letter-spacing: 1px; }

    @media (max-width: 640px) {
        .topbar { padding-right: 4px; }
        .topbar .t { font-size: 11px; letter-spacing: 0; }
        .topbar .btn { padding: 0 9px; }
        #intro .l1 { font-size: 13px; }
    }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<audio id="bgm" src="audio/true.mp3" loop preload="auto"></audio>

<div id="vig"></div>
<div id="flick"></div>

<div id="recfx">
    <div class="lines"></div>
    <div class="roll"></div>
    <div class="tint"></div>
    <div class="glitch" id="rec-glitch"></div>
    <div class="rec"><i></i>REC</div>
    <div class="zoom" id="rec-zoom">ZOOM ×1.0</div>
    <div class="tc"><span id="rec-tc">18:00:00</span><small>校园监控 · 备用机位 · CH07</small></div>
    <div class="mic">
        <span class="lb">MIC</span>
        <div class="trk"><i id="mic-bar"></i><b id="mic-peak"></b></div>
        <div class="sc"><span>0</span><span>-6</span><span>-12</span><span>-20</span><span>-40</span></div>
    </div>
</div>

<div class="topbar">
    <span class="dot"></span>
    <span class="t">秦主任办公室 · 7F · 18:00 · 潜入中</span>
    <span class="spacer"></span>
    <button class="btn" id="snd-btn" type="button">声音 关</button>
    <button class="btn primary" id="lock-btn" type="button">锁定鼠标</button>
    <a class="btn" href="index.html">返回墙墙</a>
</div>

<div id="toast"></div>

<div id="hold">
    <div class="t">发条 100%</div>
    <div class="bar"><i id="hold-bar"></i></div>
</div>

<div id="panel"><div class="card" id="panel-card"></div></div>

<div id="pad">
    <div class="box">
        <div class="disp" id="pad-disp">----</div>
        <div class="hint" id="pad-hint">四位数字密码</div>
        <div class="keys" id="pad-keys"></div>
    </div>
</div>

<div id="over">
    <div class="t1" id="over-t1"></div>
    <div class="t2" id="over-t2"></div>
    <div class="t3" id="over-t3"></div>
    <button class="btn primary" id="over-btn" type="button">再来一次</button>
</div>

<div id="intro">
    <div class="l1">18:00 · 杨紫萱 · 独自潜入</div>
    <div class="l2">一片漆黑...<br>别弄响任何东西。</div>
</div>

<div id="blackout">
    <div class="ln" id="bo-1">「真黑啊……」杨紫萱低声嘀咕道。
        <small>—— 18:00，教师办公室，门在你身后合上了</small>
    </div>
    <div class="ln" id="bo-2">「一定要小声，外面好像有人。」
        <small>—— 走廊尽头，拖把蹭着地面的声音，正在一层一层往上</small>
    </div>
    <div class="skip">点击任意处跳过</div>
    <div class="sndpick">
        <span></span>
        <button class="btn" id="bo-snd-on" type="button">开</button>
        <button class="btn" id="bo-snd-off" type="button">关</button>
        <small></small>
    </div>
</div>

<div id="mask">
    <div class="spinner" id="spin"></div>
    <div class="title" id="mask-title">你走到了办公室门口...</div>
    <div class="sub" id="mask-sub">门开了...</div>
    <div id="err"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   教师办公室 3D —— 玩家位置固定，视角自由
   ══════════════════════════════════════════════════════════ */
(function () {
    'use strict';

    /* three.js 来源：本地优先，失败/超时后依次回退 */
    var SOURCES = [
        'vendor/three.min.js',
        'https://unpkg.com/three@0.150.1/build/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js',
        'https://cdn.bootcdn.net/ajax/libs/three.js/r150/three.min.js'
    ];
    var TIMEOUT = 6000;      // 单个来源最长等待
    var started = false;

    function $(id) { return document.getElementById(id); }
    function note(msg) { var s = $('mask-sub'); if (s) s.textContent = msg; }

    function showError(title, sub, detail) {
        var bo = $('blackout'); if (bo) bo.style.display = 'none';     // 报错时别被黑幕挡住
        var spin = $('spin'); if (spin) spin.style.display = 'none';
        var t = $('mask-title'); if (t) t.textContent = title;
        note(sub);
        var e = $('err');
