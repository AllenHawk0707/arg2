<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园万事通</title>
    <style>
        /* ══ Windows 10 Fluent（与墙墙同一套视觉语言）══ */
        :root {
            --accent: #0078d7;
            --accent-d: #0063b1;
            --accent-l: #cce4f7;
            --bg: #f2f2f2;
            --surface: #ffffff;
            --surface-2: #fafafa;
            --border: #d2d2d2;
            --border-2: #e5e5e5;
            --ink: #1f1f1f;
            --ink-2: #555555;
            --ink-3: #8a8a8a;
            --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--bg);
            margin: 0 auto;
            padding: 24px 16px 48px;
            max-width: 920px;
            min-height: 100vh;
        }

        /* ── 标题栏 ── */
        .xp-window {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 32px;
            padding: 0 0 0 12px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--ink);
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 12px;
            font-weight: 400;
        }
        .window-buttons { display: flex; align-self: stretch; }
        .window-btn {
            width: 45px;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--sans);
            font-size: 10px;
            color: var(--ink-2);
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .window-btn:hover { background-color: #e5e5e5; }
        .window-btn:last-child:hover { background-color: #e81123; color: #fff; }

        /* ── 主面板 ── */
        .main-content {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            min-height: 600px;
            padding: 0 0 1px;
        }

        /* 顶部信息条 */
        .wall-meta {
            font-size: 12px;
            color: var(--ink-3);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-2);
            background-color: var(--surface-2);
        }

        .content-area {
            background-color: var(--surface);
            border: none;
            padding: 34px 16px 24px;
            min-height: 460px;
        }

        /* ── 搜索区（居中）── */
        .search-hero {
            max-width: 620px;
            margin: 0 auto 26px;
            text-align: center;
        }
        .hero-title {
            font-size: 26px;
            font-weight: 300;
            letter-spacing: 3px;
            color: var(--ink);
            margin-bottom: 6px;
        }
        .hero-sub {
            font-size: 12.5px;
            color: var(--ink-3);
            margin-bottom: 22px;
        }
        .search-box {
            display: flex;
            gap: 0;
            align-items: stretch;
        }
        .search-input {
            flex: 1;
            min-width: 0;
            height: 38px;
            padding: 0 14px;
            font-family: var(--sans);
            font-size: 14px;
            color: var(--ink);
            background: var(--surface);
            border: 1px solid var(--border);
            border-right: none;
            border-radius: 2px 0 0 2px;
            outline: none;
            transition: border-color .12s;
        }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--ink-3); }
        .search-btn {
            padding: 0 26px;
            font-family: var(--sans);
            font-size: 14px;
            color: #fff;
            background: var(--accent);
            border: 1px solid var(--accent-d);
            border-radius: 0 2px 2px 0;
            cursor: pointer;
            transition: background .12s, transform .08s;
        }
        .search-btn:hover { background: var(--accent-d); }
        .search-btn:active { transform: translateY(1px); }

        /* ── 检索结果 ── */
        .result-head {
            max-width: 620px;
            margin: 0 auto 12px;
            font-size: 12px;
            color: var(--ink-3);
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-2);
        }
        .news-list {
            max-width: 620px;
            margin: 0 auto;
        }
        .news-card {
            border: 1px solid var(--border-2);
            border-radius: 2px;
            padding: 15px 17px;
            margin-bottom: 13px;
            background: var(--surface);
            transition: border-color .12s, box-shadow .12s;
        }
        .news-card:hover {
            border-color: var(--border);
            box-shadow: 0 1px 5px rgba(0, 0, 0, .07);
        }
        .news-section {
            display: inline-block;
            font-size: 11.5px;
            color: var(--accent-d);
            background: var(--accent-l);
            border-radius: 2px;
            padding: 1px 7px;
            margin-bottom: 8px;
        }
        .news-title {
            font-size: 15.5px;
            font-weight: 600;
            color: var(--accent);
            line-height: 1.5;
            margin-bottom: 7px;
        }
        .news-meta {
            font-size: 12px;
            color: var(--ink-3);
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-2);
        }
        .news-meta span { margin-right: 14px; }
        .news-body {
            font-size: 13px;
            line-height: 1.95;
            color: var(--ink-2);
            white-space: pre-line;
        }
        mark {
            background: #fff3a3;
            color: inherit;
            padding: 0 1px;
        }

        /* 名字被涂抹 / 马赛克 */
        .redacted {
            background: #d9d9d9;
            color: transparent;
            padding: 0 6px;
            border-radius: 1px;
            user-select: none;
        }

        /* 发布时间：黑块遮住 */
        .blk {
            display: inline-block;
            background: #000;
            color: transparent;
            padding: 0 10px;
            border-radius: 1px;
            user-select: none;
        }

        .empty-state {
            max-width: 620px;
            margin: 0 auto;
            text-align: center;
            color: var(--ink-3);
            padding: 58px 0;
            font-size: 13px;
            line-height: 2;
        }

        /* ── 状态栏 ── */
        .statusbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 7px 16px;
            font-size: 11.5px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-top: none;
        }
        .statusbar a { color: var(--ink-3); text-decoration: none; }
        .statusbar a:hover { color: var(--accent); text-decoration: underline; }

        @media (max-width: 640px) {
            body { padding: 12px 8px 40px; }
            .window-btn { width: 38px; }
            .content-area { padding: 22px 12px 18px; }
            .hero-title { font-size: 21px; }
            .search-btn { padding: 0 16px; font-size: 13px; }
        }
    </style>
</head>

<div class="xp-window">
    <div class="window-title">
        <span class="mode-label">校园万事通 v1.0</span>
    </div>
    <div class="window-buttons">
        <div class="window-btn">_</div>
        <div class="window-btn">□</div>
    </div>
</div>

<div class="main-content">
    <div class="wall-meta">校园万事通 · 校内公告与通知检索平台 · 共收录 <span id="total-count">0</span> 条公告</div>

    <div class="content-area">
        <div class="search-hero">
            <div class="hero-title">校园万事通</div>
            <div class="hero-sub">校内公告、通知、活动信息一站式检索</div>
            <div class="search-box">
                <input class="search-input" id="kw" type="text" autocomplete="off"
                       placeholder="请输入关键词">
                <button class="search-btn" type="button" onclick="doSearch()">搜索</button>

        <div id="result-head" class="result-head" style="display:none"></div>
        <div id="news-list" class="news-list"></div>
        <div id="empty" class="empty-state">输入关键词开始检索</div>
    </div>
</div>

<div class="statusbar">
    <span>校园万事通 · 大同中学 校内信息检索平台</span>

</div>
