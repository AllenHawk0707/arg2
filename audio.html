<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园广播 · 音频档案</title>
    <style>
        /* ══ Windows 10 Fluent（与墙墙同一套视觉语言）══ */
        :root {
            --accent: #0078d7;
            --accent-d: #0063b1;
            --bg: #f2f2f2;
            --surface: #ffffff;
            --surface-2: #fafafa;
            --border: #d2d2d2;
            --border-2: #e5e5e5;
            --ink: #1f1f1f;
            --ink-2: #555555;
            --ink-3: #8a8a8a;
            --sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.6;
            color: var(--ink);
            background-color: var(--bg);
            margin: 0 auto;
            padding: 24px 16px 48px;
            max-width: 920px;
            min-height: 100vh;
        }

        /* ── 标题栏 ── */
        .xp-window {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            height: 32px;
            padding: 0 0 0 12px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-bottom: none;
            color: var(--ink);
        }
        .window-title { display: flex; align-items: center; gap: 9px; font-size: 12px; }
        .window-buttons { display: flex; align-self: stretch; }
        .window-btn {
            width: 45px; height: 100%;
            display: inline-flex; align-items: center; justify-content: center;
            font-family: var(--sans); font-size: 10px;
            color: var(--ink-2); background: transparent; border: none; cursor: pointer;
        }
        .window-btn:hover { background-color: #e5e5e5; }

        /* ── 主面板 ── */
        .main-content {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-top: none;
            min-height: 520px;
            padding: 0 0 1px;
        }
        .wall-meta {
            font-size: 12px;
            color: var(--ink-3);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-2);
            background-color: var(--surface-2);
        }
        .content-area {
            background-color: var(--surface);
            border: none;
            padding: 30px 16px 26px;
            min-height: 400px;
        }

        /* ── 二维码 ── */
        .qr-wrap {
            max-width: 420px;
            margin: 0 auto 22px;
            text-align: center;
        }
        .qr-img {
            width: 210px; height: 210px;
            display: block;
            margin: 0 auto 12px;
            border: 1px solid var(--border-2);
            padding: 8px;
            background: #fff;
        }
        .qr-tip { font-size: 12px; color: var(--ink-3); }

        /* ── 密码：六道下划线 ── */
        .pw-wrap {
            position: relative;
            padding: 10px 0 6px;
            text-align: center;
            cursor: pointer;
        }
        .pw-input {
            position: absolute; left: -9999px;
            width: 1px; height: 1px; opacity: 0;
            border: none; outline: none; background: transparent;
        }
        .pw-slots { display: flex; justify-content: center; gap: 12px; }
        .pw-slot {
            width: 26px; height: 22px;
            display: flex; align-items: flex-end; justify-content: center;
            font-size: 18px; line-height: 1;
            color: var(--ink-3);
            border-bottom: 2px solid var(--ink-3);
            padding-bottom: 7px;
            transition: border-color .15s, color .15s;
        }
        .pw-slot.active { border-bottom-color: var(--accent); }
        .pw-slot.filled { color: var(--accent-d); }

        .pw-error {
            min-height: 18px;
            margin-top: 8px;
            text-align: center;
            font-size: 12px;
            color: #a4262c;
        }

        /* ── 解锁后的播放器 ── */
        .player-box {
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 18px;
            border: 1px solid var(--border-2);
            border-radius: 2px;
            background: var(--surface-2);
            text-align: center;
        }
        .player-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .player-sub {
            font-size: 11.5px;
            color: var(--ink-3);
            margin-bottom: 12px;
        }
        .player-box audio { width: 100%; outline: none; }

        /* ── 状态栏 ── */
        .statusbar {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            padding: 7px 16px;
            font-size: 11.5px;
            color: var(--ink-3);
            background-color: var(--surface-2);
            border: 1px solid var(--border);
            border-top: none;
        }
        .statusbar a { color: var(--ink-3); text-decoration: none; }
        .statusbar a:hover { color: var(--accent); text-decoration: underline; }

        @media (max-width: 640px) {
            body { padding: 12px 8px 40px; }
            .window-btn { width: 38px; }
            .content-area { padding: 22px 12px 18px; }
            .qr-img { width: 180px; height: 180px; }
            .pw-slots { gap: 8px; }
        }
    </style>
</head>
<body>

<div class="xp-window">
    <div class="window-title">
        <span class="mode-label">校园广播 · 音频档案 v1.0</span>
    </div>
    <div class="window-buttons">
        <div class="window-btn">_</div>
        <div class="window-btn">□</div>
    </div>
</div>

<div class="main-content">
    <div class="wall-meta">校园广播站 · 音频档案检索 · 需凭密码调取</div>

    <div class="content-area">
        <div class="qr-wrap">
            <img class="qr-img" src="qr-audio.png" alt="扫描二维码">
            <div class="qr-tip">扫描二维码，输入档案密码后即可收听</div>
        </div>

        <div id="pw-box">
            <div class="pw-wrap" id="pw-wrap">
                <input class="pw-input" id="pw-input" type="text" maxlength="6" autocomplete="off">
                <div class="pw-slots" id="pw-slots"></div>
            </div>
            <div class="pw-error" id="pw-error"></div>
        </div>

        <div id="player-box" class="player-box" style="display:none">
            <div class="player-title">音频档案 · 编号 A1</div>
            <div class="player-sub">校园广播站存档 · 解密完成</div>
            <audio id="audio-player" controls preload="auto"></audio>
        </div>
    </div>
</div>

<div class="statusbar">
    <span>校园广播 · 大同中学 音频档案系统</span>
    <span><a href="index.html">← 返回墙墙</a></span>
</div>
